<script>
"use strict";
/* ============================ мелочи ============================ */
const $ = id => document.getElementById(id);
const S = v => v == null ? "" : String(v).replace(/\s+/g, " ").trim();
const N = v => typeof v === "number" ? v : 0;
const R2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const fmt = x => (x == null || !isFinite(x)) ? "—"
  : (Math.abs(x) < 0.005 ? "0,00" : x.toLocaleString("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2}));
const fmt0 = x => (x == null || !isFinite(x)) ? "—" : Math.round(x).toLocaleString("ru-RU");
const pct = x => (!isFinite(x) ? "—" : (x * 100).toLocaleString("ru-RU", {minimumFractionDigits:1, maximumFractionDigits:1}) + " %");
const num = s => { const t = S(s).replace(/ |\s/g, "").replace(",", "."); const v = parseFloat(t); return isFinite(v) ? v : 0; };
const esc = s => S(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const monthName = v => { const m = /(\d{4})-(\d{2})/.exec(v || ""); return m ? MONTHS[+m[2]-1] + " " + m[1] : v; };

/* ============================ справочник по умолчанию ============================ */
const BASE_BOOK = __BOOK__;
const EXAMPLE = __EXAMPLE__;

/* ============================ хранилище ============================ */
let DB = null;
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
async function loadBook(){

  let remote = null;
  if (DB) {

  }

  return {

  };
}
let hist = {};
async function loadHist(){
  let src = LS.get("hist");
  if (DB){ try { const s = await DB.doc("history/all").get(); if (s.exists) src = s.data().months || src; } catch(e){} }

}
let histTimer = null;
function saveHist(){
  clearTimeout(histTimer);
  histTimer = setTimeout(async () => {
    const own = {};
    for (const k in hist) if (!BASE_HIST[k] || hist[k].closed) own[k] = hist[k];
    LS.set("hist", own);
    if (DB){ try { await DB.doc("history/all").set({months: own}); } catch(e){} }
  }, 700);
}
const shiftMonth = (m, d) => {
  const x = /(\d{4})-(\d{2})/.exec(m); if (!x) return "";
  let y = +x[1], mm = +x[2] + d;
  while (mm < 1){ mm += 12; y--; } while (mm > 12){ mm -= 12; y++; }
  return y + "-" + String(mm).padStart(2, "0");
};
let saveTimer = null;
function saveBook(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const own = {vendors:{}, articles:{}, credit: book.credit, founders: book.founders};
    for (const k in book.vendors) if (!BASE_BOOK.vendors[k] || BASE_BOOK.vendors[k][0] !== book.vendors[k][0] || BASE_BOOK.vendors[k][1] !== book.vendors[k][1]) own.vendors[k] = book.vendors[k];
    for (const k in book.articles) if (BASE_BOOK.articles[k] !== book.articles[k]) own.articles[k] = book.articles[k];
    LS.set("book", own);
    if (DB) { try { await DB.doc("book/main").set(own); } catch(e){} }
  }, 700);
}
let paramTimer = null;
function saveParams(){
  clearTimeout(paramTimer);
  paramTimer = setTimeout(async () => {
    LS.set("params:" + st.month, {p: st.params, note: st.note || ""});
    if (DB) { try { await DB.doc("months/" + st.month).set({params: st.params, note: st.note || ""}); } catch(e){} }
  }, 700);
}
async function loadParams(month){
  if (DB) { try { const s = await DB.doc("months/" + month).get();
    if (s.exists && s.data().params) return {p: s.data().params, note: s.data().note || ""}; } catch(e){} }
  const l = LS.get("params:" + month);
  if (!l) return null;
  return l.p ? l : {p: l, note: ""};          // формат прошлых версий
}

/* ============================ разбор выгрузок ============================ */
/* Такском объявляет в листе обрезанный диапазон (A1:AT13 при 52 строках),
   поэтому границы считаем по реально существующим ячейкам, а не по «!ref». */
function realRange(ws){
  const r0 = XLSX.utils.decode_range(ws["!ref"] || "A1");
  let sr = r0.s.r, sc = r0.s.c, er = r0.e.r, ec = r0.e.c;
  for (const k in ws){
    if (k.charCodeAt(0) === 33) continue;              // служебные ключи «!…»
    const a = XLSX.utils.decode_cell(k);
    if (a.r < sr) sr = a.r;
    if (a.c < sc) sc = a.c;
    if (a.r > er) er = a.r;
    if (a.c > ec) ec = a.c;
  }
  return {s:{r:sr, c:sc}, e:{r:er, c:ec}};
}
function gridOf(ws){
  const rng = realRange(ws);
  const rows = [], levels = [], rr = ws["!rows"] || [];
  for (let r = rng.s.r; r <= rng.e.r; r++){
    const row = [];
    for (let c = rng.s.c; c <= rng.e.c; c++){
      const cell = ws[XLSX.utils.encode_cell({r, c})];
      row.push(cell ? cell.v : null);
    }
    rows.push(row);
    levels.push(rr[r] && rr[r].level != null ? rr[r].level : 0);
  }
  return {rows, levels};
}
/* период выгрузки: каждая из них пишет его по-своему */
const MON_RU = ["январ","феврал","март","апрел","ма","июн","июл","август","сентябр","октябр","ноябр","декабр"];
function monthKeyFromName(name, year){
  const n = S(name).toLowerCase();
  let best = -1;
  MON_RU.forEach((m, i) => { if (n.indexOf(m) === 0 && (best < 0 || m.length > MON_RU[best].length)) best = i; });
  return best < 0 ? "" : year + "-" + String(best + 1).padStart(2, "0");
}
function periodFromTitle(t){                       // «Обороты счета 60 за Август 2026 г.»
  const m = /за\s+([А-Яа-яЁё]+)\s+(\d{4})/.exec(S(t));
  return m ? {from:monthKeyFromName(m[1], m[2]), to:monthKeyFromName(m[1], m[2])} : null;
}
function periodFromRange(t){                       // «с 01.07.2026 … по 31.07.2026» или «01.08.2026 - 10.09.2026»
  const d = S(t).match(/(\d{2})\.(\d{2})\.(\d{4})/g);
  if (!d || d.length < 2) return null;
  const key = x => { const q = /(\d{2})\.(\d{2})\.(\d{4})/.exec(x); return q[3] + "-" + q[2]; };
  return {from:key(d[0]), to:key(d[d.length - 1])};
}
function findPeriod(rows, n){
  for (let r = 0; r < Math.min(rows.length, n || 12); r++)
    for (let c = 0; c < Math.min(rows[r].length, 4); c++){
      const v = S(rows[r][c]);
      if (/период/i.test(v)){
        const here = periodFromRange(v) || periodFromRange(S(rows[r][c + 1]));
        if (here) return here;
      }
    }
  return null;
}
function findHead(rows, must){
  for (let r = 0; r < Math.min(rows.length, 25); r++){
    const h = rows[r].map(S);
    if (must.every(n => h.indexOf(n) >= 0)) return {r, h};
  }
  return null;
}
/* «Обороты счета NN за Месяц ГГГГ г.» — уровень группировки строк отличает
   контрагента (2) от подразделения (1) и от итога по счёту (0). */
function parseOboroty(rows, levels){
  let title = "";
  for (let r = 0; r < Math.min(rows.length, 6); r++){ const t = S(rows[r][0]); if (/Обороты счета/i.test(t)) title = t; }
  const m = /Обороты счета\s+(\d+)/i.exec(title);
  if (!m) return null;
  const account = m[1];
  let hr = -1;
  for (let r = 0; r < Math.min(rows.length, 15); r++) if (S(rows[r][0]) === "Счет"){ hr = r; break; }
  if (hr < 0) return null;
  const head = rows[hr].map(S);
  const iDt = head.indexOf("Оборот Дт"), iKt = head.indexOf("Оборот Кт");
  if (iDt < 0 || iKt < 0) return null;
  const dtCols = {}, ktCols = {};
  for (let c = iDt + 1; c < iKt; c++) if (head[c]) dtCols[head[c]] = c;
  let end = head.length;
  for (let c = iKt + 1; c < head.length; c++) if (/^Конечное сальдо/.test(head[c])){ end = c; break; }
  for (let c = iKt + 1; c < end; c++) if (head[c]) ktCols[head[c]] = c;
  const iOpenDt = head.indexOf("Начальное сальдо Дт"), iOpenKt = head.indexOf("Начальное сальдо Кт");
  const items = [];
  let total = null;
  for (let r = hr + 1; r < rows.length; r++){
    const name = S(rows[r][0]);
    if (!name || name === "Подразделение" || name === "Итого") continue;
    const rec = {name, level: levels[r], dt: N(rows[r][iDt]), kt: N(rows[r][iKt]),
      openDt: iOpenDt >= 0 ? N(rows[r][iOpenDt]) : 0, openKt: iOpenKt >= 0 ? N(rows[r][iOpenKt]) : 0,
      dtBy:{}, ktBy:{}};
    for (const k in dtCols) rec.dtBy[k] = N(rows[r][dtCols[k]]);
    for (const k in ktCols) rec.ktBy[k] = N(rows[r][ktCols[k]]);
    if (name === account && levels[r] === 0) total = rec;
    else if (levels[r] >= 2) items.push(rec);
  }
  if (!total) return null;
  return {kind:"oborot", account, title, total, items, period:periodFromTitle(title)};
}
/* «Отчёт по врачам (УК)» — Фактическая оплата по врачу и направлению */
function parseDoctors(rows){
  const H = findHead(rows, ["Врач", "Фактическая оплата"]);
  if (!H) return null;
  const ci = {};
  ["Направление","Пациент","Врач","Дата","Сумма выручки","Фактическая оплата"].forEach(k => ci[k] = H.h.indexOf(k));
  const byDoc = {}, byDir = {}, allDocs = {};
  let total = 0;
  for (let r = H.r + 1; r < rows.length; r++){
    const dir = S(rows[r][ci["Направление"]]);
    if (dir === "Итог") continue;                       // строка-итог отчёта, иначе двойной счёт
    const doc = S(rows[r][ci["Врач"]]);
    if (doc) allDocs[doc] = 1;
    const pay = N(rows[r][ci["Фактическая оплата"]]);
    if (!pay) continue;
    byDoc[doc] = (byDoc[doc] || 0) + pay;
    byDir[dir || "—"] = (byDir[dir] || 0) + pay;
    total += pay;
  }
  const dirOf = {};
  for (let r = H.r + 1; r < rows.length; r++){
    const dir = S(rows[r][ci["Направление"]]), doc = S(rows[r][ci["Врач"]]);
    if (dir && dir !== "Итог" && doc && !dirOf[doc]) dirOf[doc] = dir;
  }
  return {kind:"doctors", byDoc, byDir, dirOf, allDocs, total, period:findPeriod(rows, 8)};
}
/* «Такском-Касса», сводный отчёт по фискальным документам — чеки ККТ */
function parseTaksk(rows){
  const H = findHead(rows, ["Наличными", "Безналичными", "Сумма"]);
  if (!H) return null;
  const ci = {};
  ["Дата и время","Документ","Тип операции","Наличными","Безналичными","Аванс","В кредит","Сумма"]
    .forEach(k => ci[k] = H.h.indexOf(k));
  if (ci["Документ"] < 0 || ci["Тип операции"] < 0) return null;
  const t = {cash:0, card:0, adv:0, credit:0, sum:0, live:0, refund:0, checks:0, byDay:{}, days:0};
  for (let r = H.r + 1; r < rows.length; r++){
    if (S(rows[r][ci["Документ"]]) !== "Кассовый чек") continue;   // отчёты о сменах — служебные
    const op = S(rows[r][ci["Тип операции"]]);
    const sum = N(rows[r][ci["Сумма"]]);
    if (!sum) continue;
    t.checks++;
    const cash = N(rows[r][ci["Наличными"]]), card = N(rows[r][ci["Безналичными"]]);
    t.cash += cash;
    t.card += card;
    t.adv  += N(rows[r][ci["Аванс"]]);
    t.credit += N(rows[r][ci["В кредит"]]);
    t.sum += sum;
    if (/Возврат/i.test(op)) t.refund += Math.abs(sum);
    const d = rows[r][ci["Дата и время"]];
    let key = "";
    if (d instanceof Date) key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    else { const m = /(\d{2})\.(\d{2})\.(\d{4})/.exec(S(d)); if (m) key = m[3] + "-" + m[2] + "-" + m[1]; }
    /* по дням копим живые деньги: зачёт аванса новых поступлений не даёт */
    if (key) t.byDay[key] = R2((t.byDay[key] || 0) + cash + card);
  }
  t.days = Object.keys(t.byDay).length;
  t.live = R2(t.cash + t.card);
  ["cash","card","adv","credit","sum","refund"].forEach(k => t[k] = R2(t[k]));
  return {kind:"taksk", t, period:findPeriod(rows, 12)};
}
/* Реестр оплат управленки — каналы и признак проведения в бухгалтерии */
function parsePayments(rows){
  const H = findHead(rows, ["Специалист", "Сумма руб"]);
  if (!H) return null;
  const ci = {};
  ["Дата","Специалист","Бух учет","Касса","Сумма руб","Оплата плат. картой","Оплата без. нал."].forEach(k => ci[k] = H.h.indexOf(k));
  let sum = 0, card = 0, bez = 0, cash = 0, notPosted = 0, notPostedRows = 0;
  for (let r = H.r + 1; r < rows.length; r++){
    const s = N(rows[r][ci["Сумма руб"]]);
    if (!s) continue;
    const c = N(rows[r][ci["Оплата плат. картой"]]), b = N(rows[r][ci["Оплата без. нал."]]);
    sum += s; card += c; bez += b; cash += s - c - b;
    if (ci["Бух учет"] >= 0 && !/^да/i.test(S(rows[r][ci["Бух учет"]]))){ notPosted += s; notPostedRows++; }
  }
  return {kind:"payments", sum, card, bez, cash, notPosted, notPostedRows};
}
function detect(wb){
  for (const name of wb.SheetNames){
    const {rows, levels} = gridOf(wb.Sheets[name]);
    if (!rows.length) continue;
    const o = parseOboroty(rows, levels); if (o) return o;
    const k = parseTaksk(rows);           if (k) return k;
    const d = parseDoctors(rows);         if (d) return d;
    const p = parsePayments(rows);        if (p) return p;
  }
  return null;
}
</script>
