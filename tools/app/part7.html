<style>
/* ======================= разбор цифры ======================= */
.xn{cursor:pointer;border-bottom:1px dotted var(--ghost);transition:border-color .15s,color .15s}
.xn:hover{border-bottom-color:var(--bronze2);color:var(--bronze)}
.dk .xn,.ocard .xn{border-bottom-color:rgba(217,212,201,.35)}
.dk .xn:hover,.ocard .xn:hover{border-bottom-color:var(--bronze2);color:var(--bronze2)}
#xp[hidden]{display:none!important}
#xp{position:fixed;inset:0;z-index:100;display:flex;justify-content:flex-end}
#xp .veil{position:absolute;inset:0;background:rgba(28,27,24,.34)}
#xp .pane{position:relative;width:min(560px,100%);background:var(--bg);height:100%;overflow-y:auto;
  box-shadow:-8px 0 40px rgba(28,27,24,.2);display:flex;flex-direction:column}
.xhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
  padding:18px 24px 14px;z-index:2}
.xcrumb{display:flex;gap:6px;flex-wrap:wrap;padding-right:96px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.xcrumb b{font-weight:400;color:var(--bronze);cursor:pointer}
.xcrumb b:hover{text-decoration:underline}
.xhead h3{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15;padding-right:52px}
.xval{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px;
  font-variant-numeric:tabular-nums}
.xclose{position:absolute;right:18px;top:16px}
.xbody{padding:20px 24px 48px}
.xf{background:var(--tint);border-radius:13px;padding:14px 17px;font-family:var(--mono);font-size:13px;
  line-height:1.6;color:var(--ink2);margin-bottom:16px}
.xsrc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;font-size:13px;
  color:var(--ink2);margin-bottom:20px;align-items:baseline}
.xsrc dt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--bronze);white-space:nowrap;padding-top:2px}
.xsrc dd{margin:0}
.xp-list{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:13px;
  overflow:hidden;background:var(--line)}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline;
  background:var(--panel);padding:11px 16px;font-size:13.5px}
.xrow.link{cursor:pointer}
.xrow.link:hover{background:var(--sunk)}
.xrow .l small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.xrow .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xrow .v.neg{color:var(--red)}
.xrow.res{background:var(--green-soft);font-weight:700}
.xrow .go{color:var(--bronze2);font-family:var(--mono);font-size:11px;margin-left:8px}
.xnote{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--mute);
  margin-top:18px;line-height:1.5}
@media(max-width:620px){#xp .pane{width:100%}.xhead{padding:16px 18px 12px}.xbody{padding:16px 18px 40px}}
</style>

<div id="xp" hidden role="dialog" aria-modal="true" aria-label="Разбор цифры">
  <div class="veil" id="xveil"></div>
  <div class="pane">
    <div class="xhead">
      <div class="xcrumb" id="xcrumb"></div>
      <h3 id="xtitle"></h3>
      <div class="xval" id="xval"></div>
      <button class="btn ghost sm xclose" id="xclose">Закрыть</button>
    </div>
    <div class="xbody" id="xbody"></div>
  </div>
</div>

<script>
"use strict";
/* Каждая цифра знает, из чего она сложена и из какой выгрузки пришла.
   Узел: {t заголовок, v значение, f формула словами, src источник,
          parts [{k ключ для перехода, l подпись, n примечание, v сумма}], note} */
const XSRC = {
  a60: "Обороты счёта 60 · «Оборот Дт», кор. счёт 51 · строки уровня контрагентов",
  a51: "Обороты счёта 51 из 1С",
  a57: "Обороты счёта 57 · «Оборот Дт», кор. счёт 62",
  a50: "Обороты счёта 50 из 1С",
  doc: "Отчёт по врачам (УК) · колонка «Фактическая оплата»",
  tk:  "Такском-Касса · сводный отчёт по фискальным документам",
  hand: "Введено вручную на этапе «Параметры месяца»",
  book: "Справочник статей — он же помнит разнесение с прошлых месяцев"
};
function psrc(k){ return (st.psrc && st.psrc[k]) || XSRC.hand; }
function xnode(key){
  const c = window.__calc || calc(), p = st.params, tk = st.taksk;
  const g0 = st.groups || {mal:0,pog:0,other:0,cosm:0,misc:0};
  const RU = {mal:"Маланичев", pog:"Погосян", other:"Другие хирурги", cosm:"Косметология", misc:"Прочее"};

  if (key.indexOf("ven:") === 0){
    const nm = key.slice(4), v = st.vendors.find(x => x.name === nm);
    const cl = book.vendors[nm] || ["",""];
    return {t:nm, v:v ? v.paid : 0, f:"Сумма всех оплат этому контрагенту с расчётного счёта за месяц",
      src:XSRC.a60, parts:[], note:cl[0] ? "Статья «" + cl[0] + "», блок «"
        + (book.articles[cl[0]] || cl[1] || "не задан") + "». Разнесение хранится в справочнике и подставится в следующем месяце."
        : "Статья не выбрана — эта сумма не попадает ни в медицинские, ни в управленческие."};
  }
  if (key.indexOf("art:") === 0){
    const nm = key.slice(4), a = c.byArt[nm];
    const vs = st.vendors.filter(v => (book.vendors[v.name] || [])[0] === nm && book.credit.indexOf(v.name) < 0)
      .sort((x, y) => y.paid - x.paid);
    return {t:nm, v:a ? a.sum : 0, f:"Сумма по всем контрагентам этой статьи",
      src:XSRC.book, parts:vs.map(v => ({k:"ven:" + v.name, l:v.name, v:v.paid})),
      note:"Блок «" + ((a && a.block) || "не задан") + "». Блок принадлежит статье, а не контрагенту — иначе доли по статьям расходятся."};
  }
  if (key.indexOf("grp:") === 0){
    const g = key.slice(4);
    const after = g === "other" ? c.otherNet : c.G[g];
    const parts = [{l:"По отчёту врачей за месяц", v:g0[g]}];
    if (Math.abs(c.scale - 1) > 1e-9)
      parts.push({l:"Поправка до контрольной суммы", n:"коэффициент " + c.scale.toFixed(6), v:R2(c.G[g] - g0[g])});
    if (g === "other" && p.refund) parts.push({l:"Возвраты пациентам", v:-p.refund});
    return {t:"Выручка · " + RU[g], v:after,
      f:"оплата по управленке" + (Math.abs(c.scale - 1) > 1e-9 ? " × поправка до контрольной суммы" : "")
        + (g === "other" && p.refund ? " − возвраты пациентам" : ""),
      src:XSRC.doc, parts, res:after,
      note: g === "mal" || g === "pog"
        ? "Личная выручка учредителя — она целиком его. Всё остальное делится пополам."
        : "Эта группа делится между учредителями поровну."};
  }
  const T = {
    rev: () => ({t:"Выручка за месяц", v:c.revNet, f:"контрольная сумма − возвраты пациентам",
      src: p.revBank > 0 ? psrc("revBank") : XSRC.doc,
      parts:[{k:"revbank", l:"Контрольная сумма выручки", v:c.target},
             {k:"p:refund", l:"Возвраты пациентам", v:-p.refund}], res:c.revNet,
      note:"Базис — зачисление на счёт. Разрез по врачам берётся из управленки по фактической оплате, разница разносится пропорционально."}),
    revbank: () => ({t:"Контрольная сумма выручки", v:c.target,
      f:"сумма по группам врачей" + (p.revBank > 0 ? ", приведённая к банку" : ""),
      src: p.revBank > 0 ? psrc("revBank") : XSRC.doc,
      parts:["mal","pog","other","cosm","misc"].map(g => ({k:"grp:" + g, l:RU[g], v:c.G[g]})), res:c.target,
      note: tk ? "По чекам Такском живых денег за месяц — " + fmt(tk.live)
        + " (нал " + fmt0(tk.cash) + " + безнал " + fmt0(tk.card) + "). Зачёт аванса " + fmt0(tk.adv) + " сюда не входит." : ""}),
    cost: () => ({t:"Расходы за месяц", v:c.costAll, f:"общая часть + личные обоих учредителей",
      src:"Складывается из выгрузок 1С и параметров месяца",
      parts:[{k:"common", l:"Общая часть — делится пополам", v:c.common},
             {k:"pers:mal", l:"Личные Маланичева", v:c.persM},
             {k:"pers:pog", l:"Личные Погосяна", v:c.persP}], res:c.costAll,
      note:"Если расписать до конца, личные сокращаются: расходы = счёт 60 + зарплата + налоги + банк + алименты + проценты + эквайринг."}),
    common: () => ({t:"Общая часть расходов", v:c.common, f:"то, что делится между учредителями пополам",
      src:"Обороты 51 и 60 плюс параметры месяца",
      parts:[{k:"p:tax", l:"Налоги с ФОТ", v:p.tax},
             {k:"salcommon", l:"Зарплата без ассистентов", v:c.salCommon},
             {k:"p:bank", l:"Услуги банка", v:p.bank},
             {k:"p:ali", l:"Алименты", v:p.ali},
             {k:"p:int", l:"Проценты по кредиту", v:p.int},
             {k:"common60", l:"Поставщики без личных", v:c.common60}], res:c.common}),
    salcommon: () => ({t:"Зарплата без ассистентов", v:c.salCommon, f:"вся зарплата − личные ассистенты обоих",
      src:psrc("sal"),
      parts:[{k:"p:sal", l:"Зарплата по банку", v:p.sal},
             {l:"Ассистенты Маланичева", v:-p.mAss}, {l:"Ассистенты Погосяна", v:-p.pAss}], res:c.salCommon,
      note:"Ассистенты у каждого свои, поэтому вынимаются из общей зарплаты и садятся своему учредителю."}),
    common60: () => ({t:"Поставщики без личных", v:c.common60, f:"база счёта 60 − личные, которые сидят внутри неё",
      src:XSRC.a60,
      parts:[{k:"base60", l:"База счёта 60", v:c.base60},
             {l:"Анализы обоих", n:"внутри статьи «Анализы»", v:-R2(p.mAn + p.pAn)},
             {l:"Материалы за операции обоих", v:-R2(p.mMat + p.pMat)}], res:c.common60,
      note:"Личные анализы и материалы физически лежат внутри счёта 60, поэтому их надо вынуть, иначе они посчитаются дважды."}),
    base60: () => ({t:"База счёта 60", v:c.base60, f:"оплаты контрагентам − возвраты поставщиков",
      src:XSRC.a60,
      parts:[{k:"base", l:"Сумма по контрагентам", v:c.base},
             {k:"p:corr", l:"Возвраты поставщиков", v:-p.corr}], res:c.base60}),
    base: () => ({t:"Сумма по контрагентам", v:c.base, f:"все оплаты с расчётного счёта, кроме стройки на кредит",
      src:XSRC.a60,
      parts:[{k:"med", l:"Медицинские", v:c.byBlock.m}, {k:"upr", l:"Управленческие", v:c.byBlock.u}]
        .concat(c.unclass > 0 ? [{l:"Без статьи — " + c.unclassN + " контрагентов", v:c.unclass}] : []), res:c.base,
      note:c.credit > 0 ? "За счёт кредитной линии исключено " + fmt(c.credit) + " — " + book.credit.join(", ") + "." : ""}),
    med: () => ({t:"Медицинские расходы", v:c.byBlock.m, f:"сумма статей, отнесённых к медицинским",
      src:XSRC.book,
      parts:Object.entries(c.byArt).filter(a => a[1].block === "медицинские").sort((a,b) => b[1].sum - a[1].sum)
        .map(a => ({k:"art:" + a[0], l:a[0], v:a[1].sum})), res:c.byBlock.m}),
    upr: () => ({t:"Управленческие расходы", v:c.byBlock.u, f:"сумма статей, отнесённых к управленческим",
      src:XSRC.book,
      parts:Object.entries(c.byArt).filter(a => a[1].block === "управленческие").sort((a,b) => b[1].sum - a[1].sum)
        .map(a => ({k:"art:" + a[0], l:a[0], v:a[1].sum})), res:c.byBlock.u}),
    inc: () => ({t:"Доход учредителей", v:c.incAll, f:"выручка + проценты по депозитам − расходы",
      src:"Итог расчёта",
      parts:[{k:"rev", l:"Выручка за месяц", v:c.revNet},
             {k:"p:dep", l:"Проценты по депозитам", v:p.dep},
             {k:"cost", l:"Расходы за месяц", v:-c.costAll}], res:c.incAll}),
    pay: () => ({t:"К выплате на конец месяца", v:c.payAll, f:"доход + остаток с прошлого месяца − дивиденды",
      src:"Итог расчёта",
      parts:[{k:"inc", l:"Доход за месяц", v:c.incAll},
             {l:"Остаток с прошлого месяца", n:psrc("prevM"), v:c.prevAll},
             {l:"Выплачены дивиденды", v:-c.divAll}], res:c.payAll})
  };
  for (const f of ["mal","pog"]){
    const big = f === "mal", P = big ? "M" : "P";
    T["pers:" + f] = () => ({t:"Личные расходы · " + (big ? "Маланичев" : "Погосян"),
      v: big ? c.persM : c.persP, f:"то, что каждый несёт сам",
      src:XSRC.hand,
      parts:[{l:"Анализы", n:"внутри счёта 60", v:p[(big?"m":"p") + "An"]},
             {l:"Материалы за операции", n:"внутри счёта 60", v:p[(big?"m":"p") + "Mat"]},
             {l:"Ассистенты и СММ", n:"вынуты из общей зарплаты", v:p[(big?"m":"p") + "Ass"]},
             {l:"Эквайринг с личной выручки", v:p[(big?"m":"p") + "Acq"]}], res: big ? c.persM : c.persP});
    T["cost:" + f] = () => ({t:"Доля расходов · " + (big ? "Маланичев" : "Погосян"),
      v: big ? c.costM : c.costP, f:"половина общей части + свои личные",
      src:"Методика 50/50",
      parts:[{k:"common", l:"Половина общей части", v:R2(c.common / 2)},
             {k:"pers:" + f, l:"Свои личные расходы", v: big ? c.persM : c.persP}],
      res: big ? c.costM : c.costP,
      note:"Общая часть у обоих одинаковая до копейки. Вся разница между учредителями — в личных."});
    T["inc:" + f] = () => ({t:"Доход · " + (big ? "Маланичев" : "Погосян"),
      v: big ? c.incM : c.incP, f:"своя выручка + половина общей + половина процентов − своя доля расходов",
      src:"Методика 50/50",
      parts:[{k:"grp:" + f, l:"Своя выручка", v:c.G[f]},
             {l:"Половина выручки других хирургов", v:R2(c.otherNet / 2)},
             {l:"Половина косметологии", v:R2(c.G.cosm / 2)},
             {l:"Половина прочего", v:R2(c.G.misc / 2)},
             {l:"Половина процентов по депозитам", v:R2(p.dep / 2)},
             {k:"cost:" + f, l:"Доля расходов", v: -(big ? c.costM : c.costP)}],
      res: big ? c.incM : c.incP});
    T["pay:" + f] = () => ({t:"К выплате · " + (big ? "Маланичев" : "Погосян"),
      v: big ? c.payM : c.payP, f:"доход + остаток с прошлого месяца − дивиденды",
      src:"Итог расчёта",
      parts:[{k:"inc:" + f, l:"Доход за месяц", v: big ? c.incM : c.incP},
             {l:"Остаток с прошлого месяца", n:psrc("prev" + P), v:p["prev" + P]},
             {l:"Выплачены дивиденды", v:-p["div" + P]}], res: big ? c.payM : c.payP});
  }
  if (key.indexOf("half:") === 0){
    const g = key.slice(5);
    const NM = {other:"выручки других хирургов", cosm:"косметологии", misc:"прочего", dep:"процентов по депозитам"};
    const full = g === "dep" ? p.dep : (g === "other" ? c.otherNet : c.G[g]);
    return {t:"Половина " + NM[g], v:R2(full / 2), f:"половина суммы, которая делится поровну",
      src:g === "dep" ? psrc("dep") : XSRC.doc,
      parts:[{k:g === "dep" ? "p:dep" : "grp:" + g, l:"Вся сумма", v:full},
             {l:"Доля каждого учредителя", n:"методика 50/50", v:R2(full / 2)}], res:R2(full / 2)};
  }
  if (key.indexOf("tk:") === 0){
    if (!tk) return null;
    const g = key.slice(3);
    const NM = {cash:"Наличными", card:"Безналичными", adv:"Зачёт ранее внесённого аванса",
      live:"Живые деньги", sum:"Пробито по чекам"};
    const base = {t:"Чеки · " + NM[g], v:tk[g], src:XSRC.tk, parts:[]};
    if (g === "live") return Object.assign(base, {f:"наличные + безнал, без зачёта аванса",
      parts:[{k:"tk:cash", l:"Наличными", v:tk.cash}, {k:"tk:card", l:"Безналичными", v:tk.card}], res:tk.live,
      note:"Зачёт аванса сюда не входит: это деньги, внесённые в прошлые месяцы."});
    if (g === "sum") return Object.assign(base, {f:"всё, что прошло через кассу",
      parts:[{k:"tk:live", l:"Живые деньги", v:tk.live}, {k:"tk:adv", l:"Зачёт аванса", v:tk.adv}], res:tk.sum});
    if (g === "adv") return Object.assign(base, {f:"колонка «Аванс» в чеках",
      note:"Услуга оказана сейчас, а деньги пациент внёс раньше. Новых поступлений месяца этот столбец не даёт."});
    return Object.assign(base, {f:"колонка «" + NM[g] + "» в чеках", note:"Чеков за месяц — " + tk.checks + "."});
  }
  if (key.indexOf("day:") === 0){
    if (!tk) return null;
    const d = key.slice(4), v = tk.byDay[d] || 0;
    const dd = Object.keys(tk.byDay).sort(), vals = dd.map(k => tk.byDay[k]);
    const avg = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
    return {t:"День " + d.split("-").reverse().join("."), v, f:"наличные + безнал по чекам этого дня",
      src:XSRC.tk, parts:[{l:"Средний день месяца", v:R2(avg)},
        {l:"Отклонение от среднего", v:R2(v - avg)}],
      note:"Зачёт аванса в день не попадает — он относится к месяцу, когда деньги пришли."};
  }
  if (key.indexOf("mon:") === 0){
    const m = key.slice(4), h = hist[m];
    if (!h) return null;
    return {t:"Выручка · " + monthName(m), v:h.rev || 0,
      f:h.closed ? "закрытый месяц" : "из архива выручки",
      src:h.closed ? "Снимок закрытого месяца" : "История выручки, загруженная в программу",
      parts:h.inc != null ? [{l:"Расходы", v:-(h.cost || 0)}, {l:"Доход учредителей", v:h.inc}] : [],
      note:h.closed ? "Месяц закрыт " + h.closed.split("-").reverse().join(".") + "." : ""};
  }
  if (key === "fot") return {t:"ФОТ с налогами", v:R2(p.sal + p.tax), f:"зарплата по банку + налоги с ФОТ",
    src:psrc("sal"), parts:[{k:"p:sal", l:"Зарплата по банку", v:p.sal},
      {k:"p:tax", l:"Налоги с ФОТ", v:p.tax}], res:R2(p.sal + p.tax)};
  if (key === "credit") return {t:"За счёт кредитной линии", v:c.credit,
    f:"оплаты подрядчикам, помеченным как стройка на заёмные",
    src:XSRC.a60, parts:st.vendors.filter(v => book.credit.indexOf(v.name) >= 0)
      .map(v => ({k:"ven:" + v.name, l:v.name, v:v.paid})), res:c.credit,
    note:"В расходы учредителей не входит: стройка финансируется кредитом, а не выручкой месяца."};
  if (key === "unclass") return {t:"Контрагенты без статьи", v:c.unclass,
    f:"оплаты, которые ещё не разнесены", src:XSRC.a60,
    parts:st.vendors.filter(v => !(book.vendors[v.name] || [])[0] && book.credit.indexOf(v.name) < 0)
      .map(v => ({k:"ven:" + v.name, l:v.name, v:v.paid})), res:c.unclass,
    note:"Пока статья не выбрана, эти суммы не попадают ни в медицинские, ни в управленческие."};
  if (key === "bank51"){
    const a = st.acc["51"]; if (!a) return null;
    const open = R2(a.total.openDt - a.total.openKt);
    return {t:"Остаток на расчётном счёте", v:R2(open + a.total.dt - a.total.kt),
      f:"остаток на начало + поступления − списания", src:XSRC.a51,
      parts:[{l:"Остаток на начало месяца", v:open},
             {l:"Поступления за месяц", v:a.total.dt},
             {l:"Списания за месяц", v:-a.total.kt}], res:R2(open + a.total.dt - a.total.kt)};
  }
  if (key === "halfcommon"){
    const full = R2(c.otherNet + c.G.cosm + c.G.misc);
    return {t:"Половина общей выручки", v:R2(full / 2), f:"половина всего, что заработала клиника без личных операций",
      src:XSRC.doc, parts:[{k:"grp:other", l:"Другие хирурги", v:c.otherNet},
        {k:"grp:cosm", l:"Косметология", v:c.G.cosm}, {k:"grp:misc", l:"Прочее", v:c.G.misc},
        {l:"Доля каждого", n:"методика 50/50", v:R2(full / 2)}], res:R2(full / 2)};
  }
  if (key.indexOf("p:") === 0){
    const k = key.slice(2);
    const NM = {tax:"Налоги с ФОТ", sal:"Зарплата по банку", bank:"Услуги банка", ali:"Алименты",
      int:"Проценты по кредиту", corr:"Возвраты поставщиков", dep:"Проценты по депозитам",
      refund:"Возвраты пациентам", revBank:"Контрольная сумма выручки",
      mAn:"Анализы · Маланичев", pAn:"Анализы · Погосян",
      mMat:"Материалы за операции · Маланичев", pMat:"Материалы за операции · Погосян",
      mAss:"Ассистенты и СММ · Маланичев", pAss:"Ассистенты и СММ · Погосян",
      mAcq:"Эквайринг с личной выручки · Маланичев", pAcq:"Эквайринг с личной выручки · Погосян",
      prevM:"Остаток с прошлого месяца · Маланичев", prevP:"Остаток с прошлого месяца · Погосян",
      divM:"Дивиденды · Маланичев", divP:"Дивиденды · Погосян"};
    const NOTE = {
      mAn:"Лежит внутри статьи «Анализы» на счёте 60, поэтому вычитается из общей части.",
      pAn:"Лежит внутри статьи «Анализы» на счёте 60, поэтому вычитается из общей части.",
      mMat:"Лежит внутри счёта 60, поэтому вычитается из общей части.",
      pMat:"Лежит внутри счёта 60, поэтому вычитается из общей части.",
      mAss:"Вынимается из общей зарплаты: ассистент у каждого свой.",
      pAss:"Вынимается из общей зарплаты: ассистент у каждого свой.",
      divM:"Начисленное с НДФЛ, а не выплаченное с расчётного счёта.",
      divP:"Начисленное с НДФЛ, а не выплаченное с расчётного счёта."};
    return {t:NM[k] || k, v:p[k], f:"Значение месяца", src:psrc(k), parts:[],
      note:(NOTE[k] ? NOTE[k] + " " : "") + "Поле правится руками на этапе «Параметры месяца» — расчёт пересчитается сразу."};
  }
  return T[key] ? T[key]() : null;
}
/* ---- панель ---- */
let xstack = [];
function xopen(key, reset){
  const n = xnode(key);
  if (!n) return;
  if (reset) xstack = [];
  if (xstack[xstack.length - 1] !== key) xstack.push(key);
  $("xtitle").textContent = n.t;
  $("xval").textContent = fmt(n.v) + " ₽";
  if (xstack.length > 1){
    const cr = xstack.map((k, i) => ({i, t:(xnode(k) || {t:k}).t}));
    const show = cr.length > 4
      ? [cr[0], {i:cr.length - 3, t:"…"}, cr[cr.length - 2], cr[cr.length - 1]]
      : cr;
    $("xcrumb").innerHTML = show.map((x, j) => j === show.length - 1
      ? "<span>" + esc(x.t) + "</span>"
      : "<b data-back=\"" + x.i + "\">" + esc(x.t) + "</b>").join("<span>›</span>");
  } else $("xcrumb").innerHTML = "<span>разбор цифры</span>";
  let h = n.f ? `<div class="xf">${esc(n.f)}</div>` : "";
  h += `<dl class="xsrc"><dt>Откуда</dt><dd>${esc(n.src || "—")}</dd></dl>`;
  if (n.parts && n.parts.length){
    h += `<div class="xp-list">` + n.parts.map(x => `
      <div class="xrow${x.k ? " link" : ""}"${x.k ? ' data-x="' + esc(x.k) + '"' : ""}>
        <span class="l">${esc(x.l)}${x.n ? "<small>" + esc(x.n) + "</small>" : ""}</span>
        <span class="v${x.v < 0 ? " neg" : ""}">${fmt(x.v)}${x.k ? '<span class="go">→</span>' : ""}</span>
      </div>`).join("")
      + (n.res != null ? `<div class="xrow res"><span class="l">Итого</span><span class="v">${fmt(n.res)}</span></div>` : "")
      + `</div>`;
  }
  if (n.note) h += `<p class="xnote">${n.note}</p>`;
  $("xbody").innerHTML = h;
  $("xbody").scrollTop = 0;
  $("xp").hidden = false;
}
function xclose(){ $("xp").hidden = true; xstack = []; }
document.addEventListener("click", e => {
  const back = e.target.closest("[data-back]");
  if (back){ xstack = xstack.slice(0, +back.dataset.back + 1); xopen(xstack.pop()); return; }
  const t = e.target.closest("[data-x]");
  if (!t) return;
  e.preventDefault();
  xopen(t.dataset.x, !t.closest("#xp"));
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("xp").hidden) xclose(); });
document.getElementById("xclose").addEventListener("click", xclose);
document.getElementById("xveil").addEventListener("click", xclose);
</script>
