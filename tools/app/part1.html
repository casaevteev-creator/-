<title>Управленка Формы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4F6F4; --surface:#FFFFFF; --panel:#EBEFEC; --sunk:#E3E8E5;
  --ink:#1A211E; --muted:#68736D; --faint:#8D968F; --line:#D6DCD8;
  --accent:#2B3A67; --accent-soft:#E7EAF2; --accent-line:#B8C2DC;
  --ok:#2F7D51; --ok-soft:#E4F0E8; --warn:#8E620D; --warn-soft:#F6EEDC;
  --crit:#A3342A; --crit-soft:#F7E5E2; --on-accent:#FFFFFF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1211; --surface:#161C19; --panel:#1D2421; --sunk:#121816;
    --ink:#E3E9E5; --muted:#93A099; --faint:#74807A; --line:#2A322E;
    --accent:#93A8DE; --accent-soft:#1B2236; --accent-line:#39456B;
    --on-accent:#0E1211;
    --ok:#5FB584; --ok-soft:#16271E; --warn:#D4A64C; --warn-soft:#2A2314;
    --crit:#E2796D; --crit-soft:#2C1917;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1211; --surface:#161C19; --panel:#1D2421; --sunk:#121816;
  --ink:#E3E9E5; --muted:#93A099; --faint:#74807A; --line:#2A322E;
  --accent:#93A8DE; --accent-soft:#1B2236; --accent-line:#39456B;
  --on-accent:#0E1211;
  --ok:#5FB584; --ok-soft:#16271E; --warn:#D4A64C; --warn-soft:#2A2314;
  --crit:#E2796D; --crit-soft:#2C1917;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 64px}

/* ---- шапка ---- */
header.top{border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:40}
.top-in{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:14px;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--muted);font-weight:500}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-size:12.5px;color:var(--muted)}
.month-pick{display:flex;align-items:center;gap:7px}
.month-pick input{width:120px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;
  padding:5px 8px;font-family:var(--mono);font-size:13px}
.memo{display:inline-flex;align-items:center;gap:6px}
.memo b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok)}

/* ---- каркас ---- */
.grid{display:grid;grid-template-columns:206px minmax(0,1fr);gap:34px;align-items:start;padding-top:26px}
nav.rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px}
.rail a{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;
  padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--muted);
  font-size:13.5px;border:1px solid transparent}
.rail a:hover{background:var(--panel);color:var(--ink)}
.rail a .num{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.rail a.done{color:var(--ink)}
.rail a.done .num{color:var(--ok)}
.rail-note{margin-top:14px;padding:10px;border-left:2px solid var(--accent-line);
  font-size:12px;color:var(--muted);line-height:1.45}

section{scroll-margin-top:78px;margin-bottom:42px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sec-head h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.sec-head .step{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.04em}
.sec-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:66ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:18px}
.card + .card{margin-top:14px}

/* ---- загрузка файлов ---- */
.drop{border:1.5px dashed var(--line);border-radius:10px;background:var(--surface);
  padding:30px 22px;text-align:center;transition:border-color .15s,background .15s}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{font-size:15.5px;font-weight:600;margin-bottom:5px}
.drop p{margin:0 0 14px;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:6px;
  padding:8px 15px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent-line)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.sm{padding:5px 10px;font-size:13px}

.filelist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:1px}
.filelist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:baseline;
  padding:9px 11px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.filelist li + li{margin-top:-1px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:2px 6px;border-radius:4px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.bad{background:var(--crit-soft);color:var(--crit)}
.fname{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnote{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap}

/* ---- таблицы ---- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface);position:sticky;top:0}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover td{background:var(--panel)}
tr.unknown td{background:var(--warn-soft)}
tr.unknown:hover td{background:var(--warn-soft);filter:brightness(.98)}
tr.sum td{font-weight:600;background:var(--panel)}
td select,td input{width:100%;min-width:168px;background:var(--sunk);border:1px solid var(--line);
  border-radius:5px;padding:4px 6px;font-size:13px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;white-space:nowrap}
.chip.m{background:var(--ok-soft);color:var(--ok)}
.chip.u{background:var(--accent-soft);color:var(--accent)}
.chip.c{background:var(--warn-soft);color:var(--warn)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);
  border-radius:6px;padding:7px 10px;font-size:13.5px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;
  font-size:13px;cursor:pointer;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

/* ---- параметры ---- */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
.f select{font-family:var(--sans)}
.f .hint{font-size:11.5px;color:var(--faint);margin-top:3px;font-family:var(--sans)}
.sub{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  margin:20px 0 10px;font-weight:500}
.sub:first-child{margin-top:0}

/* ---- сверки ---- */
.checks{display:flex;flex-direction:column;gap:1px}
.chk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:baseline;
  padding:11px 13px;border:1px solid var(--line);background:var(--surface)}
.chk:first-child{border-radius:9px 9px 0 0}
.chk:last-child{border-radius:0 0 9px 9px}
.chk + .chk{margin-top:-1px}
.chk .mark{font-family:var(--mono);font-weight:500;font-size:15px;line-height:1.2}
.chk.ok .mark{color:var(--ok)} .chk.warn .mark{color:var(--warn)} .chk.bad .mark{color:var(--crit)}
.chk.bad{background:var(--crit-soft)} .chk.warn{background:var(--warn-soft)}
.chk .what{font-size:13.5px}
.chk .what small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.chk .val{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}

/* ---- отчёт ---- */
.report{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:22px 24px}
.report h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:26px 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.report h3:first-child{margin-top:0}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 128px 128px 128px;gap:8px;
  padding:5px 0;font-size:13.5px;align-items:baseline}
.rrow > span:not(:first-child){font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.rrow.head{color:var(--faint);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:3px}
.rrow.head > span:not(:first-child){font-family:var(--sans)}
.rrow.tot{font-weight:600;border-top:1px solid var(--line);margin-top:5px;padding-top:8px}
.rrow.dim{color:var(--muted)}
.rrow.ind > span:first-child{padding-left:16px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;
  border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px;background:var(--line)}
.tile{background:var(--surface);padding:15px 16px}
.tile .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.tile .v{font-family:var(--mono);font-size:21px;font-weight:500;margin-top:5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.banner{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);font-size:13px;margin-bottom:16px}
.banner b{font-weight:600}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.foot{color:var(--faint);font-size:12px;margin-top:10px;line-height:1.5}

@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr);gap:18px;padding-top:16px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail a{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .rail a .st{display:none}
  .rail-note{display:none}
  .rrow{grid-template-columns:minmax(0,1fr) 96px;grid-auto-rows:min-content}
  .rrow > span:nth-child(3),.rrow > span:nth-child(4){display:none}
  .rrow.split{grid-template-columns:minmax(0,1fr) 96px 96px}
  .rrow.split > span:nth-child(3){display:block}
}
</style>
