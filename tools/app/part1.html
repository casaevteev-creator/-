<title>Управленка Формы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#1C1B18; --ink2:#423E37; --mute:#807A70; --faint:#9C968A;
  --bg:#FAF9F6; --panel:#FFFFFF; --tint:#F1EFEA; --sunk:#F6F4EF;
  --line:#E7E3D9; --ghost:#D9D4C9;
  --green:#2E5E4E; --green2:#4A7A68; --green3:#7BA08F; --green-soft:#EDF1EE;
  --bronze:#8A7350; --bronze2:#B9895A; --bronze-soft:#F4EDE3;
  --red:#A3423B; --red-soft:#F6E9E7;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Cormorant Garamond',Cambria,Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,'Liberation Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bronze2);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.mono{font-family:var(--mono)}

.wrap{max-width:1140px;margin:0 auto;padding-inline:20px;padding-block:0 72px}
@media(min-width:760px){.wrap{padding-inline:32px}}

/* ---- шапка ---- */
header.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:40}
.top-in{max-width:1140px;margin:0 auto;padding-inline:20px;padding-block:15px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap}
@media(min-width:760px){.top-in{padding-inline:32px}}
.brand{font-size:12px;font-weight:700;letter-spacing:.46em;color:var(--ink)}
.brand em{font-style:normal;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:0;
  color:var(--mute);margin-left:12px;text-transform:none}
.top-meta{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  font-size:12px;color:var(--mute)}
.month-pick{display:flex;align-items:center;gap:8px}
.month-pick label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
.month-pick input{width:128px;background:var(--sunk);border:1px solid var(--line);border-radius:9px;
  padding:6px 10px;font-family:var(--mono);font-size:12.5px}
.memo{display:inline-flex;align-items:center;gap:7px}
.memo b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ghost);flex:none}
.dot.on{background:var(--green2)}

/* ---- каркас ---- */
.grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start;padding-top:34px}
nav.rail{position:sticky;top:82px;display:flex;flex-direction:column;gap:1px}
.rail a{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;
  padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--mute);font-size:13.5px;
  transition:background .2s,color .2s}
.rail a:hover{background:var(--tint);color:var(--ink)}
.rail a .num{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ghost)}
.rail a.done{color:var(--ink)}
.rail a.done .num{color:var(--bronze2)}
.rail-note{margin-top:18px;padding:14px 16px;background:var(--tint);border-radius:14px;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink2);line-height:1.45}

section{scroll-margin-top:86px;margin-bottom:56px}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--bronze);font-weight:600}
.sec-head h2{font-family:var(--serif);font-weight:600;font-size:clamp(27px,4.2vw,38px);
  line-height:1.1;margin:10px 0 4px}
.sec-sub{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--mute);
  margin:0 0 24px;max-width:62ch;line-height:1.45}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.card + .card{margin-top:16px}

/* ---- загрузка ---- */
.drop{border:1.5px dashed var(--ghost);border-radius:18px;background:var(--panel);
  padding:36px 24px;text-align:center;transition:border-color .2s,background .2s}
.drop.hot{border-color:var(--bronze2);background:var(--bronze-soft)}
.drop h3{font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:6px}
.drop p{margin:0 0 18px;color:var(--mute);font-size:13.5px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:11px;
  padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ghost)}
.btn.ghost:hover{background:var(--tint);border-color:var(--mute)}
.btn.gold{background:var(--bronze2);border-color:var(--bronze2);color:var(--ink)}
.btn.gold:hover{background:var(--bronze);border-color:var(--bronze);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:9px}

ol.need{list-style:none}
ol.need li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:3px 14px;
  padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
ol.need li:last-child{border-bottom:0}
ol.need .nd{width:9px;height:9px;border-radius:50%;background:var(--ghost);margin-top:5px}
ol.need li.got .nd{background:var(--green2)}
ol.need li.opt .nd{background:transparent;border:1.5px solid var(--ghost)}
ol.need li.opt.got .nd{background:var(--green2);border-color:var(--green2)}
ol.need .nn{font-weight:600;font-size:14.5px}
ol.need li.got .nn{color:var(--green)}
ol.need .nw{grid-column:2;color:var(--mute);font-size:13px}
ol.need .nv{font-family:var(--mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
.needfoot{margin-top:16px;font-family:var(--serif);font-size:16px;color:var(--ink2);line-height:1.5}
.needfoot b{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--green)}

.filelist{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:8px}
.filelist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:4px 9px;border-radius:7px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.tag.bad{background:var(--red-soft);color:var(--red)}
.fname{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnote{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap}

/* ---- таблицы ---- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:var(--mute);padding:13px 18px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:#FCFBF8;position:sticky;top:0;z-index:1}
td{padding:9px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:13px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover td{background:var(--sunk)}
tr.unknown td{background:var(--bronze-soft)}
tr.sum td,tr.tot td{font-weight:700;background:var(--green-soft)}
td select,td input{width:100%;min-width:172px;background:var(--sunk);border:1px solid var(--line);
  border-radius:9px;padding:6px 9px;font-size:13px}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px}

.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input[type=search]{flex:1;min-width:170px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:9px 14px;font-size:14px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 16px;
  font-size:13px;cursor:pointer;color:var(--mute);transition:all .2s}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---- параметры ---- */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px}
.f label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);margin-bottom:6px}
.f input,.f select{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:11px;
  padding:9px 12px;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.f input:focus,.f select:focus{background:var(--panel)}
.f select{font-family:var(--sans)}
.f .hint{font-size:12px;color:var(--bronze);margin-top:5px;font-family:var(--sans);line-height:1.4}
.sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bronze);font-weight:600;margin:26px 0 13px}
.sub:first-child{margin-top:0}

/* ---- сверки ---- */
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:baseline;
  padding:15px 20px;border:1px solid var(--line);background:var(--panel);border-radius:14px}
.chk .mark{font-family:var(--mono);font-weight:600;font-size:15px}
.chk.ok{border-color:var(--line)} .chk.ok .mark{color:var(--green2)}
.chk.warn{background:var(--bronze-soft);border-color:#E8D9C4} .chk.warn .mark{color:var(--bronze)}
.chk.bad{background:var(--red-soft);border-color:#EBD5D1} .chk.bad .mark{color:var(--red)}
.chk .what{font-size:14.5px;font-weight:600}
.chk .what small{display:block;color:var(--mute);font-size:13px;font-weight:400;margin-top:3px}
.chk .val{font-family:var(--mono);font-size:12.5px;color:var(--mute);white-space:nowrap;
  font-variant-numeric:tabular-nums}

/* ---- свод и отчёт на рабочем экране ---- */
.report{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 28px}
.report h3{font-family:var(--serif);font-weight:600;font-size:22px;margin:30px 0 12px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.report h3:first-child{margin-top:0}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 132px 132px 132px;gap:10px;
  padding:6px 0;font-size:14px;align-items:baseline}
.rrow > span:not(:first-child){font-family:var(--mono);text-align:right;font-size:13px;
  font-variant-numeric:tabular-nums}
.rrow.head{color:var(--mute);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:4px}
.rrow.head > span:not(:first-child){font-family:var(--sans);font-size:10.5px}
.rrow.tot{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.rrow.dim{color:var(--mute)}
.rrow.ind > span:first-child{padding-left:18px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.tile .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.tile .v{font-family:var(--mono);font-size:clamp(21px,3vw,27px);font-weight:600;margin-top:8px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.tile .s{font-size:12.5px;color:var(--mute);margin-top:5px}
.banner{display:flex;gap:12px;align-items:baseline;padding:14px 20px;border-radius:14px;
  background:var(--tint);font-size:14px;margin-bottom:18px;color:var(--ink2)}
.banner b{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bronze);white-space:nowrap}
.banner.stop{background:var(--red-soft)} .banner.stop b{color:var(--red)}
.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}
.foot{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--mute);
  margin-top:16px;line-height:1.5;max-width:70ch}

@media (max-width:860px){
  .grid{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:20px}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:7px;padding-bottom:4px}
  .rail a{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line);
    background:var(--panel);border-radius:99px;padding:7px 14px}
  .rail a .st{display:none}
  .rail-note{display:none}
  .rrow{grid-template-columns:minmax(0,1fr) 104px}
  .rrow > span:nth-child(3),.rrow > span:nth-child(4){display:none}
}
</style>
