<script>
"use strict";
/* ============================ поля параметров ============================ */
function fillParams(){
  for (const k of PK){ const el = $(FIELD[k]); if (el) el.value = st.params[k] ? String(st.params[k]).replace(".", ",") : ""; }
}
function bindParams(){
  for (const k of PK){
    const el = $(FIELD[k]); if (!el) continue;
    el.addEventListener("input", () => { st.params[k] = num(el.value); st.psrc[k] = ""; saveParams(); render(); });
  }
}
/* ============================ приём файлов ============================ */
const ACC_RU = {"50":"касса","51":"расчётный счёт","57":"эквайринг и инкассация","60":"поставщики",
  "62":"расчёты с пациентами","67":"кредиты","68":"налоги","69":"взносы","70":"зарплата","91":"прочее"};
async function takeFiles(list){
  const files = Array.from(list);          // input.value очищается сразу, FileList к концу цикла пуст
  if (st.isExample){                       // первый настоящий файл вытесняет августовский пример
    st.isExample = false;
    st.vendors = []; st.groups = null; st.acc = {}; st.doctors = null; st.payments = null; st.taksk = null; st.files = []; st.periods = {};
    PK.forEach(k => st.params[k] = 0);
    fillParams();
  }
  for (const f of files){
    let rec = {name:f.name, tag:"не распознан", note:"—", ok:false};
    if (/\.json$/i.test(f.name)){
      try {
        const raw = JSON.parse(await f.text());
        let n = 0;
        for (const k in (raw.vendors || {})){ book.vendors[k] = raw.vendors[k]; n++; }
        for (const k in (raw.articles || {})) book.articles[k] = raw.articles[k];
        if (raw.credit) book.credit = raw.credit;
        if (raw.founders) book.founders = raw.founders;
        saveBook();
        rec.ok = true; rec.tag = "справочник"; rec.note = "принято контрагентов: " + n;
      } catch(e){ rec.note = "справочник не читается"; }
      st.files = st.files.filter(x => x.name !== rec.name).concat([rec]);
      continue;
    }
    try {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buf), {type:"array", cellStyles:true, cellDates:true});
      const p = detect(wb);
      if (p && p.period) st.periods[p.kind === "oborot" ? "счёт " + p.account
        : p.kind === "doctors" ? "отчёт по врачам" : p.kind === "taksk" ? "Такском" : p.kind] = p.period;
      if (!p){ rec.note = "не похоже на обороты счёта или отчёт по врачам"; }
      else if (p.kind === "oborot"){
        st.acc[p.account] = p;
        rec.ok = true; rec.tag = "счёт " + p.account;
        rec.note = ACC_RU[p.account] || "";
        if (p.account === "60"){
          const byName = {};                       // один контрагент может идти по нескольким подразделениям
          for (const x of p.items){
            const v = N(x.dtBy["51"]);
            if (v > 0) byName[x.name] = R2((byName[x.name] || 0) + v);
          }
          st.vendors = Object.keys(byName).map(n => ({name:n, paid:byName[n]}))
            .sort((a,b) => b.paid - a.paid);
          rec.note = "контрагентов: " + st.vendors.length + " · " + fmt(st.vendors.reduce((s,v)=>s+v.paid,0));
          pullFrom60(p);
        }
        if (p.account === "51") pullFrom51(p);
      }
      else if (p.kind === "doctors"){
        st.doctors = p; rec.ok = true; rec.tag = "врачи";
        rec.note = "фактическая оплата: " + fmt(p.total);
        fillFounders(); regroup();
      }
      else if (p.kind === "taksk"){
        st.taksk = p.t; rec.ok = true; rec.tag = "такском";
        rec.note = "чеков " + p.t.checks + " · живые деньги " + fmt0(p.t.live)
          + " · зачёт аванса " + fmt0(p.t.adv);
        if (!st.params.refund && p.t.refund){ st.params.refund = p.t.refund; st.psrc.refund = XSRC.tk + " · чеки «Возврат прихода»"; }
        say("revHint", "живые деньги по чекам: " + fmt(p.t.live) + " (нал " + fmt0(p.t.cash)
          + " + безнал " + fmt0(p.t.card) + "). Зачёт аванса " + fmt0(p.t.adv)
          + " новых поступлений не даёт.");
        fillParams();
      }
      else if (p.kind === "payments"){
        st.payments = p; rec.ok = true; rec.tag = "оплаты";
        rec.note = "нал " + fmt0(p.cash) + " · карта " + fmt0(p.card) + " · безнал " + fmt0(p.bez);
      }
    } catch(e){ rec.note = "не открылся: " + (e && e.message ? e.message : "ошибка"); }
    st.files = st.files.filter(x => x.name !== rec.name).concat([rec]);
  }
  render();
}
/* подсказки из выгрузок — заполняем пустые поля, заполненные не трогаем */
function hint(k, v, src){ if (!st.params[k] && v) { st.params[k] = R2(v); st.psrc[k] = src || ""; } }
function say(id, text){ const el = $(id); if (el) el.textContent = text; }
function pullFrom51(p){
  const kt = p.total.ktBy || {}, dt = p.total.dtBy || {};
  hint("sal", kt["70"], "Обороты счёта 51 · Кт, кор. счёт 70");
  hint("ali", kt["76"], "Обороты счёта 51 · Кт, кор. счёт 76");
  hint("refund", kt["62"], "Обороты счёта 51 · Кт, кор. счёт 62");
  hint("dep", dt["91"], "Обороты счёта 51 · Дт, кор. счёт 91");
  // ниже — только подсказки: цифры из банка не равны нужным, вычитать надо руками
  if (N(kt["68"]) + N(kt["69"]))
    say("hTax", "по банку счета 68 и 69: " + fmt(R2(N(kt["68"]) + N(kt["69"]))) + " — вычтите НДФЛ с дивидендов");
  if (N(kt["75"])) say("hDiv", "выплачено с расчётного счёта: " + fmt(N(kt["75"])) + " — здесь ставится начисленное, с НДФЛ");
  if (N(kt["91"])) say("hBank", "списано по счёту 91: " + fmt(N(kt["91"])));
  fillParams();
}
function pullFrom60(p){
  const t = p.total;
  hint("corr", N(t.ktBy && t.ktBy["51"]), "Обороты счёта 60 · Кт, кор. счёт 51");
  fillParams();
}
function fillFounders(){
  const names = Object.keys(st.doctors.allDocs || st.doctors.byDoc).filter(Boolean).sort((a,b) => a.localeCompare(b, "ru"));
  const guess = re => names.find(n => re.test(n)) || "";
  if (!book.founders.mal) book.founders.mal = guess(/Маланич/i);
  if (!book.founders.pog) book.founders.pog = guess(/Погос/i);
  for (const [id, key] of [["fMal","mal"], ["fPog","pog"]]){
    $(id).innerHTML = `<option value="">— не выбран —</option>` +
      names.map(n => `<option${n === book.founders[key] ? " selected" : ""}>${esc(n)}</option>`).join("");
  }
}
function regroup(){
  if (!st.doctors){ return; }
  const g = {mal:0, pog:0, other:0, cosm:0, misc:0};
  for (const doc in st.doctors.byDoc){
    const v = st.doctors.byDoc[doc];
    if (doc && doc === book.founders.mal) g.mal += v;
    else if (doc && doc === book.founders.pog) g.pog += v;
    else if (!doc) g.misc += v;
    else if (/косметолог/i.test(st.doctors.dirOf[doc] || "")) g.cosm += v;
    else g.other += v;
  }
  for (const k in g) g[k] = R2(g[k]);
  st.groups = g;
  if (!st.params.revBank) { st.params.revBank = R2(g.mal+g.pog+g.other+g.cosm+g.misc); fillParams(); }
}
/* ============================ выгрузка в Excel ============================ */
function buildWorkbook(c){
  const p = st.params, wb = XLSX.utils.book_new();
  const r = (n, a, b, d) => [n, a == null ? "" : a, b == null ? "" : b, d == null ? "" : d];
  const A = [
    ["ООО «ОМЕГА» · расчёт за " + monthName(st.month)], [],
    ["ВЫРУЧКА", "Всего", "Маланичев", "Погосян"],
    r("Свои операции", R2(c.G.mal + c.G.pog), c.G.mal, c.G.pog),
    r("Другие хирурги", c.otherNet), r("Косметология", c.G.cosm), r("Прочее", c.G.misc),
    r("Итого выручка", c.revNet), [],
    ["РАСХОДЫ", "Всего", "Маланичев", "Погосян"],
    r("Налоги с ФОТ", p.tax, p.tax/2, p.tax/2),
    r("Зарплата без ассистентов", c.salCommon, c.salCommon/2, c.salCommon/2),
    r("Услуги банка", p.bank, p.bank/2, p.bank/2),
    r("Алименты", p.ali, p.ali/2, p.ali/2),
    r("Проценты по кредиту", p.int, p.int/2, p.int/2),
    r("Поставщики без личных", c.common60, c.common60/2, c.common60/2),
    r("Общая часть", c.common, c.common/2, c.common/2),
    r("   Анализы", R2(p.mAn+p.pAn), p.mAn, p.pAn),
    r("   Материалы за операции", R2(p.mMat+p.pMat), p.mMat, p.pMat),
    r("   Ассистенты и СММ", R2(p.mAss+p.pAss), p.mAss, p.pAss),
    r("   Эквайринг с личной выручки", R2(p.mAcq+p.pAcq), p.mAcq, p.pAcq),
    r("Личные, каждому свои", R2(c.persM+c.persP), c.persM, c.persP),
    r("ДОЛЯ РАСХОДОВ КАЖДОГО", c.costAll, c.costM, c.costP),
    r("Справочно: за счёт кредитной линии", c.credit), [],
    ["ДОХОД УЧРЕДИТЕЛЕЙ", "Всего", "Маланичев", "Погосян"],
    r("Личная выручка", R2(c.G.mal+c.G.pog), c.G.mal, c.G.pog),
    r("Половина выручки других хирургов", c.otherNet, c.otherNet/2, c.otherNet/2),
    r("Половина косметологии", c.G.cosm, c.G.cosm/2, c.G.cosm/2),
    r("Половина прочего", c.G.misc, c.G.misc/2, c.G.misc/2),
    r("Половина процентов по депозитам", p.dep, p.dep/2, p.dep/2),
    r("Минус доля расходов", -c.costAll, -c.costM, -c.costP),
    r("ДОХОД ЗА МЕСЯЦ", c.incAll, c.incM, c.incP), [],
    ["К ВЫПЛАТЕ", "Всего", "Маланичев", "Погосян"],
    r("Доход за месяц", c.incAll, c.incM, c.incP),
    r("Остаток с прошлого месяца", c.prevAll, p.prevM, p.prevP),
    r("Выплачены дивиденды", -c.divAll, -p.divM, -p.divP),
    r("ИТОГО К ВЫПЛАТЕ", c.payAll, c.payM, c.payP), [],
    ["Сверки"],
  ];
  for (const x of checks(c)) A.push([(x.ok === true ? "OK  " : x.ok === false ? "НЕ СХОДИТСЯ  " : "—  ") + x.what, x.val]);
  const ws1 = XLSX.utils.aoa_to_sheet(A);
  ws1["!cols"] = [{wch:44},{wch:16},{wch:16},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws1, "Расчёт");

  const B = [["Контрагент", "Оплачено", "Статья", "Блок", "За счёт кредита"]];
  for (const v of st.vendors){
    const cl = book.vendors[v.name] || ["", ""];
    B.push([v.name, v.paid, cl[0], book.articles[cl[0]] || cl[1] || "", book.credit.indexOf(v.name) >= 0 ? "да" : ""]);
  }
  B.push(["Возвраты поставщиков", -p.corr, "", "", ""]);
  B.push(["БАЗА СЧЁТА 60", c.base60, "", "", ""]);
  const ws2 = XLSX.utils.aoa_to_sheet(B);
  ws2["!cols"] = [{wch:50},{wch:15},{wch:32},{wch:16},{wch:15}];
  XLSX.utils.book_append_sheet(wb, ws2, "Контрагенты");

  const C = [["Статья", "Сумма", "Доля", "Блок"]];
  Object.entries(c.byArt).sort((a,b) => b[1].sum - a[1].sum)
    .forEach(([k, v]) => C.push([k, v.sum, c.base ? v.sum / c.base : 0, v.block]));
  C.push(["Медицинские", c.byBlock.m, c.base ? c.byBlock.m / c.base : 0, ""]);
  C.push(["Управленческие", c.byBlock.u, c.base ? c.byBlock.u / c.base : 0, ""]);
  const ws3 = XLSX.utils.aoa_to_sheet(C);
  ws3["!cols"] = [{wch:38},{wch:16},{wch:10},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws3, "Статьи");
  return wb;
}
/*OFFER*/
async function offer(filename, blob){
  const d = await claude.use("downloads").catch(() => null);
  if (!d){ alert("Сохранение файлов недоступно в этом окне. Откройте ссылку в браузере на компьютере."); return; }
  try { await d.save({filename, data: blob}); }
  catch(e){ if (e && e.code !== "declined") alert("Не сохранилось: " + (e.message || e.code)); }
}
/*ENDOFFER*/
function toast(text){
  const t = $("toast"); t.textContent = text; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
function isClosed(){ return !!(hist[st.month] && hist[st.month].closed); }
function closeMonth(){
  const c = calc();
  const bad = checks(c).filter(x => x.ok === false);
  if (bad.length && !confirm("Не сходится: " + bad.map(x => x.what).join("; ")
    + ".\n\nВсё равно закрыть месяц?")) return;
  hist[st.month] = Object.assign(snapshotOf(c), {closed: new Date().toISOString().slice(0, 10)});
  saveHist(); render();
  toast("Месяц закрыт. Цифры сохранены в историю — учредители увидят динамику.");
}
function reopenMonth(){
  if (!confirm("Открыть месяц заново? Он снова станет черновиком.")) return;
  if (hist[st.month]) delete hist[st.month].closed;
  saveHist(); render();
}
function carryPersonal(){
  const pm = shiftMonth(st.month, -1), prev = LS.get("params:" + pm);
  if (!prev){ toast("За " + monthName(pm) + " параметров не сохранено"); return; }
  ["mAn","mMat","mAss","pAn","pMat","pAss"].forEach(k => st.params[k] = N(prev[k]));
  fillParams(); saveParams(); render();
  toast("Личные расходы взяты из " + monthName(pm) + " — проверьте суммы");
}
function pullPrevBalance(){
  const pm = shiftMonth(st.month, -1), prev = hist[pm];
  if (!prev || prev.payM == null) return;
  say("hPrev", "по закрытому " + monthName(pm) + ": " + fmt(prev.payM) + " и " + fmt(prev.payP));
  if (!st.params.prevM && !st.params.prevP){
    st.params.prevM = prev.payM; st.params.prevP = prev.payP;
    st.psrc.prevM = st.psrc.prevP = "Строка «К выплате» закрытого " + monthName(pm);
    fillParams(); saveParams();
  }
}
const EXPORT_ASSETS = __EXPORT__;
/* Отчёт уходит учредителям отдельным файлом: цифры месяца в нём заморожены,
   разбор по клику работает, интернет и учётные записи не нужны. */
function bodyForExport(){
  const tmp = document.createElement("div");
  tmp.innerHTML = $("dashBody").innerHTML;
  tmp.querySelectorAll(".advisor").forEach(n => n.remove());   // советчику нужен Claude, в файле его нет
  let i = 0;
  tmp.querySelectorAll(".kick").forEach(n => {                 // перенумеровать без раздела советчика
    n.textContent = n.textContent.replace(/^\d+/, () => String(++i).padStart(2, "0"));
  });
  return tmp.innerHTML;
}
function exportReport(){
  renderDash();
  const acc = {};
  for (const k in st.acc) acc[k] = {total: st.acc[k].total};
  const frozen = {c: calc(), params: st.params, psrc: st.psrc, taksk: st.taksk,
    groups: st.groups, vendors: st.vendors, acc, month: st.month, hist,
    book: {vendors: book.vendors, articles: book.articles, credit: book.credit, founders: book.founders}};
  const data = JSON.stringify(frozen).split("<\/").join("<\\/");
  const per = monthName(st.month);
  const html = '<!doctype html><html lang="ru"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>Отчёт учредителям · ' + per + '</title>'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">'
    + '<style>' + EXPORT_ASSETS.css
    + '\nbody{background:var(--bg)}#dash{position:static;height:auto;overflow:visible;background:var(--bg)}'
    + '\n.dclose{display:none}\n</style></head><body>'
    + '<div id="dash">' + bodyForExport() + '</div>'
    + EXPORT_ASSETS.panel
    + '<script>window.FROZEN=' + data + ';<\/script>'
    + '<script>' + EXPORT_ASSETS.js + '<\/script></body></html>';
  offer("Отчёт учредителям — " + per + ".html", new Blob([html], {type:"text/html;charset=utf-8"}));
  toast("Файл готов. Его можно отправить в мессенджере — откроется у кого угодно.");
}
/* ============================ события ============================ */
function wire(){
  $("pick").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", e => { const f = Array.from(e.target.files); e.target.value = ""; takeFiles(f); });
  const dz = $("drop");
  ["dragenter","dragover"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add("hot"); }));
  ["dragleave","drop"].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove("hot"); }));
  dz.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files) takeFiles(e.dataTransfer.files); });
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => e.preventDefault());

  $("month").addEventListener("change", async e => {
    st.month = e.target.value;
    /* выгрузки принадлежат месяцу — при смене месяца данные всегда обнуляются */
    st.files = []; st.acc = {}; st.vendors = []; st.doctors = null; st.payments = null;
    st.taksk = null; st.groups = null; st.periods = {}; st.psrc = {}; st.isExample = false;
    const saved = await loadParams(st.month);
    PK.forEach(k => st.params[k] = saved ? N(saved.p[k]) : 0);
    st.note = saved ? (saved.note || "") : "";
    $("mnote").value = st.note;
    fillParams(); pullPrevBalance(); render();
  });

  $("vbody").addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.art != null){
      const v = st.vendors[+t.dataset.art];
      let art = t.value;
      if (art === "__new"){
        art = S(prompt("Название новой статьи расхода:", ""));
        if (!art){ render(); return; }
        if (!book.articles[art]) book.articles[art] = "";
      }
      const cur = book.vendors[v.name] || ["", ""];
      book.vendors[v.name] = [art, art ? (cur[1] || book.articles[art] || "") : ""];
      saveBook(); render();
    }
    if (t.dataset.blk != null){
      const v = st.vendors[+t.dataset.blk];
      const cur = book.vendors[v.name] || ["", ""];
      book.vendors[v.name] = [cur[0], t.value];
      if (cur[0]) book.articles[cur[0]] = t.value;     // блок запоминается за статьёй целиком
      saveBook(); render();
    }
    if (t.dataset.cred != null){
      const v = st.vendors[+t.dataset.cred];
      const i = book.credit.indexOf(v.name);
      if (t.checked && i < 0) book.credit.push(v.name);
      if (!t.checked && i >= 0) book.credit.splice(i, 1);
      saveBook(); render();
    }
  });
  $("vsearch").addEventListener("input", e => { st.q = e.target.value; render(); });
  const pills = [["fAll","all"], ["fNew","new"], ["fCred","cred"]];
  pills.forEach(([id, key]) => $(id).addEventListener("click", () => {
    st.filter = key;
    pills.forEach(([i2, k2]) => $(i2).setAttribute("aria-pressed", String(k2 === key)));
    render();
  }));
  ["fMal","fPog"].forEach((id, i) => $(id).addEventListener("change", e => {
    book.founders[i ? "pog" : "mal"] = e.target.value; saveBook(); regroup(); render();
  }));

  $("closeMonth").addEventListener("click", () => isClosed() ? reopenMonth() : closeMonth());
  $("carryPers").addEventListener("click", carryPersonal);
  $("exportRep").addEventListener("click", exportReport);
  $("mnote").addEventListener("input", e => { st.note = e.target.value; saveParams(); render(); });
  $("dlDigest").addEventListener("click", async () => {
    const txt = ADV_RULES + "\n\nЦИФРЫ МЕСЯЦА\n\n" + monthDigest()
      + "\n\nВОПРОС ВЛАДЕЛЬЦЕВ: Что главное в этом месяце и что с этим делать?";
    let copied = false;
    try { await navigator.clipboard.writeText(txt); copied = true; } catch(e){}
    await offer("Сводка месяца — " + monthName(st.month) + ".txt",
      new Blob([txt], {type:"text/plain;charset=utf-8"}));
    toast(copied ? "Сводка скопирована и сохранена файлом — вставьте её в чат с Claude"
                 : "Сводка сохранена файлом — откройте и вставьте в чат с Claude");
  });
  $("printRep").addEventListener("click", () => { renderDash(); $("dash").hidden = false; setTimeout(() => window.print(), 120); });
  const cl = $("copyLink");
  if (cl) cl.addEventListener("click", async () => {
    const url = location.href.split("#")[0] + "#report";
    try { await navigator.clipboard.writeText(url); toast("Ссылка скопирована — учредители откроют сразу отчёт"); }
    catch(e){ prompt("Скопируйте ссылку для учредителей:", url); }
  });

  $("dlXlsx").addEventListener("click", async () => {
    const c = calc();
    const out = XLSX.write(buildWorkbook(c), {bookType:"xlsx", type:"array"});
    await offer("Расчёт-" + st.month + ".xlsx", new Blob([out]));
  });
  $("dlBook").addEventListener("click", async () => {
    const dump = {vendors: book.vendors, articles: book.articles,
      credit: book.credit, founders: book.founders};
    await offer("Справочник-статей.json",
      new Blob([JSON.stringify(dump, null, 1)], {type:"application/json"}));
  });
  $("reset").addEventListener("click", () => {
    if (!confirm("Убрать загруженные выгрузки и цифры месяца? Справочник статей сохранится.")) return;
    st.files = []; st.acc = {}; st.vendors = []; st.doctors = null; st.payments = null; st.taksk = null; st.groups = null; st.periods = {};
    st.isExample = false; PK.forEach(k => st.params[k] = 0);
    fillParams(); render();
  });
}
/* ============================ старт ============================ */
async function start(){
  book = await loadBook();
  hist = await loadHist();
  st.month = "2026-08";
  $("month").value = st.month;
  st.vendors = EXAMPLE.vendors.map(v => ({name:v[0], paid:v[1]}));
  st.groups = EXAMPLE.groups;
  PK.forEach(k => st.params[k] = N(EXAMPLE.params[k]));
  const savedNow = await loadParams(st.month);
  if (savedNow){ PK.forEach(k => st.params[k] = N(savedNow.p[k])); st.note = savedNow.note || ""; }
  $("mnote").value = st.note;
  fillParams(); bindParams(); wire(); pullPrevBalance(); render();
  // советчик описан в следующем скрипте — спрашиваем после разбора страницы
  setTimeout(() => { if (typeof advisor === "function") advisor(); }, 0);
  if (/report|отч/i.test(decodeURIComponent(location.hash))) $("openDash").click();

  claude.use("db").then(async d => {
    if (!d) return;
    DB = d;
    book = await loadBook();
    hist = await loadHist();
    pullPrevBalance(); render();
  }).catch(() => {});
}
if (typeof claude === "undefined") window.claude = {use: () => Promise.resolve(null)};
start();
</script>
