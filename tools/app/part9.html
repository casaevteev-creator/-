<style>
/* ======================= разбор месяца ======================= */
.adv{background:var(--ink);color:#fff;border-radius:20px;padding:28px 26px}
@media(min-width:760px){.adv{padding:34px 36px}}
.adv h3{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:6px}
.adv .lead{font-family:var(--serif);font-style:italic;font-size:17px;color:#9C968A;margin-bottom:22px}
.advtwo{display:grid;grid-template-columns:1fr;gap:20px;margin-bottom:6px}
@media(min-width:720px){.advtwo{grid-template-columns:1fr 1fr;gap:30px}}
.advcol{display:flex;flex-direction:column;gap:11px;align-items:flex-start}
.advcol h3{font-family:var(--serif);font-size:22px;font-weight:600;margin:0}
.advd{font-size:14px;line-height:1.55;color:#A8A296;flex:1}
.adv .btn.light{color:#E4E0D7;border-color:rgba(217,212,201,.34);background:rgba(255,255,255,.06)}
.adv .btn.light:hover{background:var(--bronze2);border-color:var(--bronze2);color:var(--ink)}
.advout{margin-top:24px;font-size:15px;line-height:1.65;color:#E4E0D7;
  border-top:1px solid rgba(217,212,201,.14);padding-top:20px;min-height:24px}
.advout[hidden]{display:none}
.advout p{margin-bottom:12px}
.advout b{color:#fff;font-weight:600}
.advout .num{font-family:var(--mono);color:#8FBFA9;font-weight:500}
.advout ul{margin:0 0 12px 20px}
.advout li{margin-bottom:7px}
.advout h4{font-family:var(--serif);font-size:19px;font-weight:600;color:#fff;margin:18px 0 8px}
.advout.fix{font-size:14.5px}
.advout.fix p{margin-bottom:10px}
.advout.fix ol{margin:0 0 12px 22px}
.advout.fix li{margin-bottom:9px}
.advwait{color:#9C968A;font-family:var(--mono);font-size:13px}
.advwait::after{content:"";animation:advdots 1.4s steps(4,end) infinite}
@keyframes advdots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}
.advfoot{color:#7E786E;font-size:12.5px;margin-top:16px;line-height:1.5}
.xask{margin-top:16px}
</style>
<script>
"use strict";
let ADV = undefined;                       // undefined — ещё не спрашивали, null — недоступно
async function advisor(){
  if (ADV === undefined){
    ADV = (typeof claude !== "undefined" && claude.use)
      ? await claude.use("sample").catch(() => null) : null;
  }
  return ADV;
}
/* Сводка месяца: всё, на что опирается разбор. Никаких пациентов. */
function monthDigest(full){
  const c = calc(), p = st.params, tk = st.taksk, L = [];
  const R = (k, v) => L.push(k + ": " + fmt(v));
  L.push("МЕСЯЦ: " + monthName(st.month) + (hist[st.month] && hist[st.month].closed ? " (закрыт)" : " (черновик)"));
  L.push("");
  L.push("ВЫРУЧКА");
  R("  всего за месяц (после возвратов)", c.revNet);
  R("  Маланичев, свои операции", c.G.mal);
  R("  Погосян, свои операции", c.G.pog);
  R("  другие хирурги", c.otherNet);
  R("  косметология", c.G.cosm);
  R("  прочее", c.G.misc);
  R("  возвраты пациентам", p.refund);
  if (tk){
    L.push("  по чекам ККТ: наличными " + fmt(tk.cash) + ", безналом " + fmt(tk.card)
      + ", зачёт ранее внесённого аванса " + fmt(tk.adv) + ", живых денег " + fmt(tk.live)
      + ", чеков " + tk.checks + ", возвратов по чекам " + fmt(tk.refund));
    const dd = Object.keys(tk.byDay).sort(), v = dd.map(k => tk.byDay[k]);
    if (dd.length > 3){
      const avg = v.reduce((a, b) => a + b, 0) / v.length;
      const mx = Math.max(...v), mn = Math.min(...v);
      L.push("  по дням: средний " + fmt(avg) + ", лучший " + fmt(mx) + ", худший " + fmt(mn)
        + ", дней " + dd.length);
      L.push("  ряд по дням: " + dd.map(k => (+k.slice(8)) + ":" + Math.round(tk.byDay[k] / 1000)).join(" ") + " (тыс. руб.)");
    }
  }
  L.push("");
  L.push("РАСХОДЫ");
  R("  всего за месяц", c.costAll);
  R("  общая часть (делится пополам)", c.common);
  R("  налоги с ФОТ", p.tax);
  R("  зарплата по банку", p.sal);
  R("  услуги банка", p.bank);
  R("  алименты", p.ali);
  R("  проценты по кредиту", p.int);
  R("  оплаты поставщикам, база счёта 60", c.base60);
  R("  из них медицинские", c.byBlock.m);
  R("  из них управленческие", c.byBlock.u);
  if (c.credit > 0) R("  за счёт кредитной линии (в расходы не входит)", c.credit);
  L.push("  статьи расходов по убыванию:");
  Object.entries(c.byArt).sort((a, b) => b[1].sum - a[1].sum).slice(0, full ? 99 : 20)
    .forEach(a => L.push("    " + a[0] + " — " + fmt(a[1].sum) + " (" + a[1].block + ")"));
  if (full && c.unclassN){
    L.push("  контрагенты без статьи (" + c.unclassN + " на " + fmt(c.unclass) + "):");
    st.vendors.filter(v => !(book.vendors[v.name] || [])[0] && book.credit.indexOf(v.name) < 0)
      .sort((a, b) => b.paid - a.paid).forEach(v => L.push("    " + v.name + " — " + fmt(v.paid)));
  }
  if (full && Object.keys(st.periods).length){
    L.push("  периоды загруженных выгрузок:");
    for (const k in st.periods) L.push("    " + k + ": " + monthName(st.periods[k].from)
      + (st.periods[k].to !== st.periods[k].from ? " … " + monthName(st.periods[k].to) : ""));
  }
  const gv = st.vendors.filter(v => (book.vendors[v.name] || [])[0] === "Гонорары ИП хирургов")
    .sort((a, b) => b.paid - a.paid).slice(0, 8);
  if (gv.length) L.push("  крупнейшие получатели гонораров: " + gv.map(v => v.name + " " + fmt0(v.paid)).join("; "));
  L.push("");
  L.push("ЛИЧНЫЕ РАСХОДЫ УЧРЕДИТЕЛЕЙ");
  L.push("  Маланичев: анализы " + fmt(p.mAn) + ", материалы за операции " + fmt(p.mMat)
    + ", ассистенты " + fmt(p.mAss) + ", эквайринг " + fmt(p.mAcq));
  L.push("  Погосян: анализы " + fmt(p.pAn) + ", материалы за операции " + fmt(p.pMat)
    + ", ассистенты " + fmt(p.pAss) + ", эквайринг " + fmt(p.pAcq));
  L.push("");
  L.push("ИТОГ");
  R("  проценты по депозитам", p.dep);
  L.push("  ФОРМУЛА: доход = выручка + проценты по депозитам − расходы");
  L.push("  " + fmt(c.revNet) + " + " + fmt(p.dep) + " − " + fmt(c.costAll) + " = " + fmt(c.incAll));
  R("  доход учредителей за месяц", c.incAll);
  R("    Маланичев", c.incM);
  R("    Погосян", c.incP);
  L.push("  маржа (доход к выручке): " + pct(c.revNet ? c.incAll / c.revNet : 0));
  L.push("");
  L.push("РАСЧЁТЫ С УЧРЕДИТЕЛЯМИ (накопленным итогом, не за месяц)");
  L.push("  ФОРМУЛА: к выплате = доход за месяц + остаток с прошлого месяца − дивиденды");
  R("  остаток с прошлого месяца, Маланичев", p.prevM);
  R("  остаток с прошлого месяца, Погосян", p.prevP);
  R("  начислены дивиденды, Маланичев", p.divM);
  R("  начислены дивиденды, Погосян", p.divP);
  R("  к выплате Маланичеву", c.payM);
  R("  к выплате Погосяну", c.payP);
  L.push("  «К выплате» больше месячного дохода потому, что это накопленный остаток за прошлые месяцы.");
  const a51 = st.acc["51"];
  if (a51) R("  остаток на расчётном счёте на конец месяца",
    R2(a51.total.openDt - a51.total.openKt + a51.total.dt - a51.total.kt));
  L.push("");
  L.push("ВЫРУЧКА ПО МЕСЯЦАМ (история; отчётный месяц — из расчёта выше, не из архива)");
  const live = Object.assign({}, hist);
  live[st.month] = Object.assign({}, live[st.month] || {}, {rev: c.revNet, inc: c.incAll});
  Object.keys(live).sort().slice(-24).forEach(k => {
    if (live[k] && live[k].rev) L.push("  " + monthName(k) + ": " + fmt0(live[k].rev)
      + (live[k].inc != null ? ", доход " + fmt0(live[k].inc) : "")
      + (k === st.month ? "  ← отчётный месяц" : ""));
  });
  const an = anomalies(c);
  if (an && (an.fresh.length || an.jump.length)){
    L.push("");
    L.push("ИЗМЕНЕНИЯ ПРОТИВ ПРОШЛОГО МЕСЯЦА");
    an.fresh.forEach(x => L.push("  новая статья: " + x[0] + " — " + fmt0(x[1])));
    an.jump.forEach(x => L.push("  выросло: " + x[0] + " — было " + fmt0(x[2]) + ", стало " + fmt0(x[1])));
  }
  const bad = checks(calc()).filter(x => x.ok === false || x.ok === "warn");
  if (bad.length){
    L.push("");
    L.push("НЕЗАКРЫТЫЕ СВЕРКИ");
    bad.forEach(x => L.push("  " + (x.ok === false ? "не сходится" : "внимание") + ": " + x.what + " — " + x.sub));
  }
  return L.join("\n");
}
const RULES_OWNERS =
  "Ты управляющий партнёр частной клиники пластической хирургии и эстетической косметологии «Форма» " +
  "(ООО «ОМЕГА»). Пишешь короткий комментарий к месяцу для двух владельцев — практикующих хирургов " +
  "Маланичева и Погосяна, доли 50/50. Они не финансисты и прочтут это первым делом в отчёте.\n\n" +
  "Правила:\n" +
  "— от 150 до 220 слов, не больше;\n" +
  "— спокойно и по делу, как партнёр пишет партнёру; без канцелярита и без вводных фраз;\n" +
  "— только о результатах месяца: сколько заработали, куда ушло, что изменилось против прошлых " +
  "месяцев, на что смотреть дальше;\n" +
  "— каждое утверждение подкрепляй числом из данных;\n" +
  "— НЕ обсуждай устройство отчёта, методику расчёта, полноту данных, сверки и то, каких выгрузок " +
  "не хватает — владельцам это не нужно, и цифры уже сверены;\n" +
  "— не сомневайся в цифрах и не оправдывайся;\n" +
  "— два-четыре коротких абзаца, без заголовков; важное выделяй **жирным**.";
const RULES_FIX =
  "Ты проверяешь данные месяца перед тем, как отчёт уйдёт владельцам клиники. Пишешь для того, " +
  "кто ведёт учёт и может всё поправить.\n\n" +
  "Правила:\n" +
  "— пиши только о том, что стоит проверить или исправить в самих данных: спорное разнесение статей " +
  "по блокам, контрагенты без статьи, суммы, которые выбиваются, незакрытые сверки, несогласованные " +
  "периоды выгрузок, подозрительно круглые или разовые платежи;\n" +
  "— каждый пункт: что не так, на какую сумму, что сделать. Одним-двумя предложениями;\n" +
  "— по убыванию суммы, не больше семи пунктов, нумерованным списком вида «1. …»;\n" +
  "— не предлагай менять методику расчёта и устройство отчёта — они заданы;\n" +
  "— если поправить нечего, скажи это одной строкой и не выдумывай замечаний ради количества.";
function advFormat(t){
  const esc2 = s => s.replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch]));
  return esc2(t)
    .replace(/^##\s*(.+)$/gm, "<h4>$1</h4>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|\s)(−?\d[\d  ]*(?:,\d+)?)(\s*(?:₽|руб))/g, '$1<span class="num">$2</span>$3')
    .split(/\n{2,}/).map(b => {
      if (/^<h4>/.test(b)) return b;
      if (/^\s*\d+\.\s/m.test(b))
        return "<ol>" + b.split(/\n/).map(l => l.replace(/^\s*\d+\.\s*/, "")).filter(Boolean)
          .map(l => "<li>" + l + "</li>").join("") + "</ol>";
      if (/^\s*[-—•]\s/m.test(b))
        return "<ul>" + b.split(/\n/).map(l => l.replace(/^\s*[-—•]\s*/, "")).filter(Boolean)
          .map(l => "<li>" + l + "</li>").join("") + "</ul>";
      return "<p>" + b.replace(/\n/g, "<br>") + "</p>";
    }).join("");
}
let advBusy = false, lastAnswer = "";
async function advRun(mode){
  if (advBusy) return;
  const out = $("advout"), sm = await advisor();
  if (!sm){ out.hidden = false; out.innerHTML =
    '<p class="advwait" style="animation:none">Сводка собирается только когда программа открыта по ссылке. ' +
    'В автономном файле и в выгруженном отчёте её нет — там остаются посчитанные выводы выше.</p>'; return; }
  advBusy = true;
  const own = mode === "owners";
  out.hidden = false;
  out.className = "advout" + (own ? "" : " fix");
  out.innerHTML = '<p class="advwait">' + (own ? "Собираю комментарий по месяцу" : "Проверяю данные месяца") + '</p>';
  try {
    await sm((own ? RULES_OWNERS : RULES_FIX) + "\n\nЦИФРЫ МЕСЯЦА\n\n" + monthDigest(!own),
      {modelTier:"complex", onText:({text}) => { lastAnswer = text; out.innerHTML = advFormat(text); }});
    out.insertAdjacentHTML("beforeend", own
      ? '<button class="btn gold sm" id="advtake" type="button" style="margin-top:18px">' +
        'Поставить в отчёт учредителям</button>' +
        '<p class="advfoot">Текст встанет разделом «Слово к месяцу» сразу после резюме и уедет в файл, ' +
        'который вы отправите. Поправить его можно на рабочем экране.</p>'
      : '<p class="advfoot">Это только для вас: в отчёт и в файл учредителям не попадает.</p>');
  } catch(e){
    const code = e && e.code;
    out.innerHTML = "<p>" + (code === "not_granted" ? "Сборка в этом окне не разрешена."
      : code === "rate_limited" ? "Слишком часто — подождите минуту и попробуйте снова."
      : "Не получилось собрать: " + ((e && e.message) || code || "ошибка")) + "</p>"
      + (e && e.text ? advFormat(e.text) : "");
  }
  advBusy = false;
}
/* Комментарий владельца к месяцу. Едет в отчёт и в файл учредителям —
   они читают готовый текст, программа им не нужна. */
function noteSection(){
  const t = (st.note || "").trim();          // S() схлопнул бы абзацы в одну строку
  if (!t) return "";
  return `<section class="tight"><div class="w">
    <div class="kick">\u00a7\u00a7 · Комментарий</div><h2>Слово к месяцу</h2>
    <div class="sb">Что важно знать про этот месяц</div>
    <div class="note-sec">${advFormat(t)}</div>
  </div></section>`;
}
function advSection(){
  return `<section class="tight advisor"><div class="w">
    <div class="kick">\u00a7\u00a7 · Сборка</div><h2>Комментарий и проверка</h2>
    <div class="sb">Собирается по цифрам этого месяца · одна кнопка, без вопросов</div>
    <div class="adv">
      <div class="advtwo">
        <div class="advcol">
          <h3>Сводка учредителям</h3>
          <p class="advd">Короткий комментарий по результатам месяца: сколько заработали, куда ушло,
          что изменилось. Без методики и без сверок — только то, что им нужно прочесть.</p>
          <button class="btn gold" id="advOwners" type="button">Собрать сводку</button>
        </div>
        <div class="advcol">
          <h3>Что поправить в данных</h3>
          <p class="advd">Спорное разнесение статей, контрагенты без статьи, выбивающиеся суммы,
          незакрытые сверки. Для вас, в отчёт не попадает.</p>
          <button class="btn ghost light" id="advFix" type="button">Проверить данные</button>
        </div>
      </div>
      <div class="advout" id="advout" hidden></div>
      <p class="advfoot">В сборку уходят только цифры этого отчёта: выручка, статьи расходов,
      история по месяцам и сверки. Данных пациентов в программе нет.</p>
    </div>
  </div></section>`;
}
document.addEventListener("click", e => {
  if (e.target.id === "advOwners"){ advRun("owners"); return; }
  if (e.target.id === "advFix"){ advRun("fix"); return; }
  if (e.target.id === "advtake"){
    const box = $("mnote");
    if (box){ box.value = lastAnswer; st.note = lastAnswer; saveParams(); render(); }
    toast("Поставлено в отчёт — раздел «Слово к месяцу» сразу после резюме");
  }
});
</script>
