<style>
/* ======================= отчёт учредителям ======================= */
#dash[hidden]{display:none!important}
#dash{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
#dash .w{max-width:1060px;margin:0 auto;padding-inline:20px}
@media(min-width:760px){#dash .w{padding-inline:32px}}
.dclose{position:fixed;right:18px;top:18px;z-index:90;background:var(--ink);color:#fff;
  border:1px solid rgba(217,212,201,.38);box-shadow:0 2px 14px rgba(28,27,24,.18)}
.dclose:hover{background:var(--bronze2);color:var(--ink);border-color:var(--bronze2)}
@media(min-width:1000px){.dclose{right:28px;top:26px}}

/* герой */
.dhero{background:var(--ink);color:#fff;padding:76px 0 64px;position:relative;overflow:hidden}
.dhero::before,.dhero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.dhero::before{right:-180px;top:-180px;width:560px;height:560px;border:1px solid rgba(185,137,90,.22)}
.dhero::after{right:-80px;top:-80px;width:360px;height:360px;border:1px solid rgba(185,137,90,.36)}
.dhero .bd{font-size:12px;font-weight:700;letter-spacing:.55em;margin-bottom:12px}
.dhero .tg{font-family:var(--serif);font-style:italic;color:#9C968A;font-size:16px;max-width:34ch}
.dhero h1{font-family:var(--serif);font-weight:600;font-size:clamp(38px,8vw,74px);line-height:1;margin:34px 0 4px}
.dhero .yr{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(26px,5.5vw,46px);
  color:var(--bronze2)}
.dhero .strip{display:grid;grid-template-columns:1fr 1fr;gap:24px 30px;margin-top:46px;max-width:640px}
@media(min-width:760px){.dhero .strip{display:flex;gap:48px;flex-wrap:wrap;max-width:none}}
.dhero .strip .v{font-family:var(--mono);font-size:clamp(19px,4.4vw,25px);font-weight:600;
  font-variant-numeric:tabular-nums}
.dhero .strip .l{font-size:11.5px;color:#9C968A;margin-top:5px}

#dash section{padding:62px 0;margin:0;scroll-margin-top:0}
@media(min-width:760px){#dash section{padding:82px 0}}
#dash section.tight{padding-top:0}
#dash h2{font-family:var(--serif);font-weight:600;font-size:clamp(28px,5vw,46px);line-height:1.08;margin:12px 0 8px}
#dash .sb{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--mute);margin-bottom:30px}
#dash section.dk{background:var(--ink);color:#fff}
#dash section.dk h2{color:#fff} #dash section.dk .sb{color:#9C968A}

/* тезисы */
.tez{display:grid;grid-template-columns:46px 1fr;gap:10px 20px;padding:22px 0;
  border-bottom:1px solid var(--line);align-items:start}
@media(min-width:880px){.tez{grid-template-columns:64px 340px 1fr;gap:24px}}
.tez:last-child{border-bottom:0}
.tez .n{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--bronze);line-height:1}
.tez h3{font-size:16px;font-weight:700;line-height:1.35}
.tez p{grid-column:1/-1;font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink2)}
@media(min-width:880px){.tez p{grid-column:auto}}
.tez p b{font-family:var(--sans);font-size:14.5px;font-weight:700;color:var(--green)}

/* карточки показателей */
.kpi{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:620px){.kpi{grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:18px}}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px}
.kc .v{font-family:var(--mono);font-size:clamp(26px,5.5vw,34px);font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.kc .v small{font-size:14px;color:var(--mute);font-weight:400;letter-spacing:0}
.kc .l{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin-top:11px}
.kc .d{font-size:13px;margin-top:6px;color:var(--mute)}

.dsplit{display:grid;grid-template-columns:1fr;gap:22px;align-items:center}
@media(min-width:860px){.dsplit{grid-template-columns:320px 1fr;gap:36px}}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 20px}
.donut{width:100%;max-width:300px;margin:0 auto;display:block}
.dcv{font-family:var(--mono);font-size:28px;font-weight:600;fill:var(--ink)}
.dcl{font-size:10.5px;fill:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.sw{display:inline-block;width:11px;height:11px;border-radius:3.5px;margin-right:9px;vertical-align:-1px}

.stackbar{display:flex;height:54px;border-radius:15px;overflow:hidden;margin:8px 0 22px;gap:2px}
.stackbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);
  font-size:12px;white-space:nowrap;min-width:0}

.rank{display:flex;flex-direction:column;gap:11px}
.rk{display:grid;gap:5px}
.rk .t{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;align-items:baseline}
.rk .t span{font-family:var(--mono);font-size:12.5px;color:var(--mute);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.rk .tr{height:10px;background:var(--tint);border-radius:4px;overflow:hidden}
.rk .fl{display:block;height:100%;border-radius:0 4px 4px 0;min-width:3px;background:var(--green);
  transition:filter .15s}
.rk:hover .fl{filter:brightness(1.15)}
.rk.u .fl{background:var(--bronze)}

/* водопад */
.wfscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wfin{min-width:600px}
@media(min-width:760px){.wfin{min-width:0}}
.wf{display:flex;align-items:flex-end;gap:10px;height:320px;border-bottom:1.5px solid var(--ink);
  padding:30px 2px 0}
@media(min-width:760px){.wf{gap:18px;height:370px}}
.wcol{flex:1;position:relative;height:100%}
.wbar{position:absolute;left:0;right:0;border-radius:5px}
.wbar.pos{background:var(--green)} .wbar.exp{background:#CCC5B7} .wbar.inv{background:var(--bronze2)}
.wbridge{position:absolute;left:0;right:-10px;border-top:1px dashed var(--ghost)}
.wv{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11.5px;
  font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
@media(min-width:760px){.wv{font-size:13px}}
.wl{display:flex;gap:10px;padding:13px 2px 0}
@media(min-width:760px){.wl{gap:18px}}
.wl span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--ink2);line-height:1.3;
  overflow-wrap:break-word}

/* карточки учредителей */
.own{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:880px){.own{grid-template-columns:1fr 1fr;gap:24px}}
.ocard{background:rgba(255,255,255,.045);border:1px solid rgba(217,212,201,.16);border-radius:20px;
  padding:28px 24px 24px}
@media(min-width:760px){.ocard{padding:34px 34px 28px}}
.ocard h3{font-family:var(--serif);font-size:30px;font-weight:600;margin-bottom:18px}
.orow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;
  border-bottom:1px solid rgba(217,212,201,.12);font-size:14px;color:#CFC9BD}
.orow .n{font-family:var(--mono);font-weight:600;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.orow .n.neg{color:#D98A82}
.oinc{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:18px 0 8px}
.oinc .t{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#7BA08F}
.oinc .n{font-family:var(--mono);font-size:25px;font-weight:600;color:#8FBFA9;font-variant-numeric:tabular-nums}
.opay{margin-top:16px;background:var(--bronze2);color:var(--ink);border-radius:14px;padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;gap:14px}
.opay .t{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;max-width:11ch}
.opay .n{font-family:var(--mono);font-size:22px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.onote{font-family:var(--serif);font-style:italic;font-size:16px;color:#9C968A;margin-top:26px;max-width:860px}
.dnote{background:var(--green-soft);border-radius:16px;padding:20px 24px;margin-top:22px;
  font-size:14px;color:var(--ink2);line-height:1.6}
.dnote b{color:var(--green)}
/* выручка по дням */
.dail{display:flex;align-items:flex-end;gap:2px;height:170px;border-bottom:1.5px solid var(--ink);padding:0 2px}
.dail i{flex:1;display:block;background:var(--green);border-radius:3px 3px 0 0;position:relative;min-height:1px}
.dail i:hover{background:var(--bronze2)}
.dail i:hover::after{content:attr(data-v);position:absolute;bottom:calc(100% + 8px);left:50%;
  transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;font-family:var(--mono);
  padding:5px 10px;border-radius:7px;white-space:nowrap;z-index:5}
.dx{display:flex;gap:2px;padding-top:9px}
.dx span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--mute)}
/* динамика по месяцам */
.mbars{display:flex;align-items:flex-end;gap:0;height:230px;border-bottom:1.5px solid var(--ink);padding:22px 4px 0}
@media(min-width:760px){.mbars{height:280px}}
.mg{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:100%;position:relative}
.mb{width:min(5vw,26px);border-radius:5px 5px 0 0;position:relative}
.mb.prev{background:var(--ghost)} .mb.cur{background:var(--green)} .mb.now{background:var(--bronze2)}
.mb .bv{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:var(--mono);
  font-size:10.5px;white-space:nowrap;color:var(--ink2)}
@media(max-width:760px){.mb .bv{display:none}.mb{width:min(4vw,26px)}.mg{gap:2px}}
.mx{display:flex;padding:9px 4px 0}
.mx span{flex:1;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.leg{display:flex;gap:20px;padding:14px 4px 0;font-size:13px;color:var(--mute);flex-wrap:wrap}
.kc .d.up{color:var(--green)} .kc .d.dn{color:var(--red)}
#dash footer{background:var(--ink);color:#6E6960;font-family:var(--mono);font-size:11.5px;
  padding:28px 0;border-top:1px solid rgba(217,212,201,.12)}
#dash footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media print{
  header.top, .grid, .toast, .dclose{display:none!important}
  #dash{position:static;overflow:visible;background:#fff}
  #dash section{padding:26px 0;break-inside:avoid}
  .dhero{padding:40px 0 34px;break-after:avoid}
  .kpi, .own, .dsplit{break-inside:avoid}
  .tez, .kc, .ocard, .chartbox{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:14mm}
}
</style>

<div id="dash" hidden role="dialog" aria-modal="true" aria-label="Отчёт учредителям">
  <button class="btn sm dclose" id="closeDash">Закрыть</button>
  <div id="dashBody"></div>
</div>

<script>
"use strict";
const MLN = x => (x / 1e6).toLocaleString("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2});
function rankRow(name, val, den, upr){
  const w = den > 0 ? Math.max(0, val / den * 100) : 0;
  return `<div class="rk${upr ? " u" : ""}" title="${esc(name)} — ${fmt(val)} ₽">
    <div class="t"><b style="font-weight:400">${esc(name)}</b><span>${fmt0(val)} · ${pct(den ? val/den : 0)}</span></div>
    <div class="tr"><i class="fl" style="width:${w.toFixed(2)}%"></i></div></div>`;
}
function donut(parts, centre, label){
  const R = 108, C = 2 * Math.PI * R;
  const tot = parts.reduce((s, p) => s + p.v, 0) || 1;
  let off = 0, out = "";
  for (const p of parts){
    const len = C * p.v / tot;
    out += `<circle cx="130" cy="130" r="${R}" fill="none" stroke="${p.c}" stroke-width="34"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 130 130)"><title>${esc(p.n)} — ${fmt(p.v)} ₽</title></circle>`;
    off += len;
  }
  return `<svg class="donut" viewBox="0 0 260 260" role="img" aria-label="${esc(label)}">${out}
    <text x="130" y="126" text-anchor="middle" class="dcv">${centre}</text>
    <text x="130" y="148" text-anchor="middle" class="dcl">${esc(label)}</text></svg>`;
}
function waterfall(steps){
  let run = 0, peak = 0;
  const pts = steps.map(s => {
    const from = s.end ? 0 : run;
    const to = s.end ? s.v : run + s.v;
    if (!s.end) run += s.v;
    const lo = Math.min(from, to), hi = Math.max(from, to);
    peak = Math.max(peak, hi);
    return {lo, hi, s};
  });
  const cols = pts.map((p, i) => {
    const bottom = p.lo / peak * 100, height = Math.max(0.6, (p.hi - p.lo) / peak * 100);
    const cls = p.s.end ? "inv" : (p.s.v >= 0 ? "pos" : "exp");
    return `<div class="wcol">
      <div class="wbar ${cls}" style="bottom:${bottom.toFixed(2)}%;height:${height.toFixed(2)}%"></div>
      <div class="wv" style="bottom:calc(${(p.lo + (p.hi - p.lo)) / peak * 100}% + 9px)">${(p.s.v < 0 ? "−" : "") + MLN(Math.abs(p.s.v))}</div>
      ${i < pts.length - 1 ? `<div class="wbridge" style="bottom:${(p.s.end ? p.hi : (p.s.v >= 0 ? p.hi : p.lo)) / peak * 100}%"></div>` : ""}
    </div>`;
  }).join("");
  return `<div class="wfscroll"><div class="wfin"><div class="wf">${cols}</div>
    <div class="wl">${steps.map(s => `<span>${esc(s.n)}</span>`).join("")}</div></div></div>`;
}
function renderDash(){
  const c = calc(), p = st.params;
  const K = t => "\u00a7\u00a7 · " + t;   // номер проставляется в конце, по порядку на странице
  const per = monthName(st.month);
  const G = c.G, den = c.revNet || 1;
  const revParts = [
    {n:"Другие хирурги", v:c.otherNet, c:"#2E5E4E"},
    {n:"Погосян", v:G.pog, c:"#4A7A68"},
    {n:"Маланичев", v:G.mal, c:"#7BA08F"},
    {n:"Косметология", v:G.cosm, c:"#B9895A"},
    {n:"Прочее", v:G.misc, c:"#D9D4C9"}
  ].filter(x => x.v > 0);
  const arts = Object.entries(c.byArt).sort((a, b) => b[1].sum - a[1].sum);
  const top = arts.slice(0, 9);
  const rest = arts.slice(9).reduce((s, a) => s + a[1].sum, 0);
  const mSh = c.base ? c.byBlock.m / c.base : 0, uSh = c.base ? c.byBlock.u / c.base : 0;
  const bank51 = st.acc["51"] ? R2(st.acc["51"].total.openDt - st.acc["51"].total.openKt
    + st.acc["51"].total.dt - st.acc["51"].total.kt) : null;
  const fot = R2(p.sal + p.tax);
  const wf = [
    {n:"Выручка и проценты", v:R2(c.revNet + p.dep)},
    {n:"Поставщики", v:-c.base60},
    {n:"ФОТ и налоги", v:-fot},
    {n:"Банк, алименты, проценты", v:-R2(p.bank + p.ali + p.int + p.mAcq + p.pAcq)},
    {n:"Доход учредителей", v:c.incAll, end:true}
  ];
  /* каналы поступления и выручка по дням — из чеков Такском */
  const tk = st.taksk;
  let chan = "", daily = "";
  if (tk){
    const rowsC = [["Наличными", tk.cash], ["Безналичными", tk.card], ["Зачёт ранее внесённого аванса", tk.adv]]
      .filter(r => r[1] > 0);
    chan = `<div class="tw" style="margin-top:18px"><table>
      <tr><th>Канал поступления</th><th class="num">Сумма, ₽</th><th class="num">Доля</th></tr>
      ${rowsC.map(r => `<tr><td>${esc(r[0])}</td><td class="num">${fmt0(r[1])}</td>
        <td class="num">${pct(tk.sum ? r[1] / tk.sum : 0)}</td></tr>`).join("")}
      ${tk.refund > 0 ? `<tr><td>Возвраты по чекам</td><td class="num" style="color:var(--red)">−${fmt0(tk.refund)}</td><td class="num"></td></tr>` : ""}
      <tr class="tot"><td>Живые деньги — нал плюс безнал</td><td class="num">${fmt0(tk.live)}</td>
        <td class="num">${pct(tk.sum ? tk.live / tk.sum : 0)}</td></tr>
      <tr><td>Пробито по чекам всего</td><td class="num">${fmt0(tk.sum)}</td><td class="num">100,0 %</td></tr>
    </table></div>
    <p class="sb" style="margin:12px 0 0;font-size:16px">Чеков за месяц — ${tk.checks}.
    ${tk.adv > 0 ? "Зачёт аванса — " + pct(tk.sum ? tk.adv / tk.sum : 0) + " от пробитого: это деньги, внесённые раньше, новых поступлений он не даёт." : ""}</p>`;

    const dd = Object.keys(tk.byDay).sort();
    if (dd.length > 3){
      const peak = Math.max(...dd.map(k => tk.byDay[k])) || 1;
      const best = dd.reduce((a, k) => tk.byDay[k] > tk.byDay[a] ? k : a, dd[0]);
      const worst = dd.reduce((a, k) => tk.byDay[k] < tk.byDay[a] ? k : a, dd[0]);
      const avg = dd.reduce((a, k) => a + tk.byDay[k], 0) / dd.length;
      const dayN = k => +k.slice(8);
      daily = `<section class="tight"><div class="w">
        <div class="kick">${K("Ритм")}</div><h2>Выручка по дням</h2>
        <div class="sb">млн ₽ в день · наличные и безнал по чекам, без зачёта аванса · наведите на столбец</div>
        <div class="chartbox">
          <div class="dail">${dd.map(k => `<i style="height:${(tk.byDay[k]/peak*100).toFixed(1)}%;opacity:${(0.55 + 0.45*tk.byDay[k]/peak).toFixed(2)}"
            data-v="${dayN(k)} ${per.split(" ")[0]} · ${MLN(tk.byDay[k])} млн ₽"></i>`).join("")}</div>
          <div class="dx">${dd.map((k,i) => `<span>${(dayN(k) % 5 === 0 || i === 0) ? dayN(k) : ""}</span>`).join("")}</div>
        </div>
        <div class="dnote"><b>Средний день — ${MLN(avg)} млн ₽.</b>
          Сильнейший — ${dayN(best)} число (${MLN(tk.byDay[best])} млн),
          самый тихий — ${dayN(worst)} (${MLN(tk.byDay[worst])} млн).</div>
      </div></section>`;
    }
  }

  /* динамика: выручка по месяцам, текущий год против прошлого */
  const yr = +(st.month.slice(0, 4)), mo = +(st.month.slice(5, 7));
  const months = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
  const live = Object.assign({}, hist);
  live[st.month] = Object.assign({}, live[st.month] || {}, {rev: c.revNet, inc: c.incAll});
  const rowFor = y => months.map((_, i) => {
    const k = y + "-" + String(i + 1).padStart(2, "0");
    return live[k] && live[k].rev ? live[k].rev : 0;
  });
  const cur = rowFor(yr), prevY = rowFor(yr - 1);
  const lastM = cur.reduce((a, v, i) => v ? i : a, -1);
  const peakM = Math.max(...cur, ...prevY) || 1;
  const ytd = cur.slice(0, lastM + 1).reduce((a, b) => a + b, 0);
  const ytdPrev = prevY.slice(0, lastM + 1).reduce((a, b) => a + b, 0);
  const hasPrevY = ytdPrev > 0;
  const dyn = lastM >= 1 ? `
  <section class="tight"><div class="w">
    <div class="kick">${K("Динамика")}</div><h2>Год к году</h2>
    <div class="sb">Выручка по месяцам, млн ₽ · ${yr} против ${yr - 1}</div>
    <div class="chartbox">
      <div class="mbars">${months.slice(0, lastM + 1).map((_, i) => `<div class="mg">
        ${prevY[i] ? `<div class="mb prev" style="height:${(prevY[i]/peakM*100).toFixed(1)}%"></div>` : ""}
        <div class="mb ${i + 1 === mo && yr === +(st.month.slice(0,4)) ? "now" : "cur"}"
             style="height:${(cur[i]/peakM*100).toFixed(1)}%">
          ${cur[i] ? `<span class="bv">${MLN(cur[i])}</span>` : ""}</div>
      </div>`).join("")}</div>
      <div class="mx">${months.slice(0, lastM + 1).map(m => `<span>${m}</span>`).join("")}</div>
      <div class="leg">
        <span><span class="sw" style="background:var(--ghost)"></span>${yr - 1}</span>
        <span><span class="sw" style="background:var(--green)"></span>${yr}</span>
        <span><span class="sw" style="background:var(--bronze2)"></span>отчётный месяц</span>
      </div>
    </div>
    <div class="dnote"><b>С начала года — ${MLN(ytd)} млн ₽.</b>
      ${hasPrevY ? "За те же месяцы " + (yr - 1) + " года — " + MLN(ytdPrev) + " млн, это "
        + (ytd >= ytdPrev ? "рост" : "спад") + " на " + pct(Math.abs(ytd / ytdPrev - 1)) + "."
        : "Сравнить с прошлым годом не с чем: данных за " + (yr - 1) + " год нет."}
      ${prevY[mo - 1] ? " В " + months[mo - 1].toLowerCase() + " " + (yr - 1) + " было "
        + MLN(prevY[mo - 1]) + " млн." : " За этот месяц прошлого года данных нет."}</div>
  </div></section>` : "";

  /* дельты к прошлому месяцу */
  const pm = shiftMonth(st.month, -1), prevS = hist[pm];
  const delta = (now, was, invert) => {
    if (!was) return {cls:"", txt:""};
    const d = now / was - 1;
    if (Math.abs(d) < 0.001) return {cls:"", txt:"как в " + monthName(pm).split(" ")[0]};
    const good = invert ? d < 0 : d > 0;
    return {cls: good ? "up" : "dn",
      txt: (d > 0 ? "▲ +" : "▼ −") + pct(Math.abs(d)).replace(" %", " %") + " к " + monthName(pm).split(" ")[0]};
  };
  const dRev = delta(c.revNet, prevS && prevS.rev);
  const dCost = delta(c.costAll, prevS && prevS.cost, true);
  const dInc = delta(c.incAll, prevS && prevS.inc);

  const who = (nm, own, cost, inc, pay, prev, div) => `<div class="ocard">
    <h3>${nm}</h3>
    <div class="orow"><span>Своя выручка</span><span class="n">${fmt0(own)}</span></div>
    <div class="orow"><span>Половина общей выручки</span><span class="n">${fmt0(R2((c.otherNet + G.cosm + G.misc) / 2))}</span></div>
    <div class="orow"><span>Половина процентов по депозитам</span><span class="n">${fmt0(p.dep/2)}</span></div>
    <div class="orow"><span>Доля расходов</span><span class="n neg">−${fmt0(cost)}</span></div>
    <div class="oinc"><span class="t">Доход за месяц</span><span class="n">${fmt0(inc)}</span></div>
    <div class="orow"><span>Остаток с прошлого месяца</span><span class="n">${fmt0(prev)}</span></div>
    <div class="orow"><span>Выплачены дивиденды</span><span class="n neg">−${fmt0(div)}</span></div>
    <div class="opay"><span class="t">К выплате</span><span class="n">${fmt0(pay)}</span></div>
  </div>`;
  const tez = (n, h, t) => `<div class="tez"><div class="n">${n}</div><h3>${h}</h3><p>${t}</p></div>`;

  const out = `
  <header class="dhero"><div class="w">
    <div class="bd">Ф О Р М А</div>
    <div class="tg">клиника пластической хирургии и эстетической косметологии</div>
    <h1>Отчёт учредителям</h1>
    <div class="yr">${per.charAt(0).toUpperCase() + per.slice(1)}${st.isExample ? " · пример" : ""}</div>
    <div class="strip">
      <div><div class="v mono">${MLN(c.revNet)}</div><div class="l">млн ₽ выручка</div></div>
      <div><div class="v mono" style="color:#8FBFA9">${MLN(c.incAll)}</div><div class="l">млн ₽ доход учредителей</div></div>
      <div><div class="v mono">${MLN(c.costAll)}</div><div class="l">млн ₽ расходы</div></div>
      <div><div class="v mono" style="color:#B9895A">${MLN(c.payAll)}</div><div class="l">млн ₽ к выплате</div></div>
    </div>
  </div></header>

  <section><div class="w">
    <div class="kick">${K("Резюме")}</div><h2>Итог месяца</h2>
    <div class="sb">Четыре числа, которые описывают ${per} полностью</div>
    ${tez("01", "Выручка — " + MLN(c.revNet) + " млн ₽",
      "Свои операции хирургов-учредителей — <b>" + fmt0(R2(G.mal + G.pog)) + " ₽</b>, остальное делится пополам. Возвраты пациентам — " + fmt0(p.refund) + " ₽.")}
    ${tez("02", "Расходы — " + MLN(c.costAll) + " млн ₽",
      "Это " + pct(c.revNet ? c.costAll / c.revNet : 0) + " выручки. Поставщики — <b>" + MLN(c.base60) + " млн</b>, ФОТ с налогами — " + MLN(fot) + " млн." + (c.credit > 0 ? " Ремонт за счёт кредитной линии, " + MLN(c.credit) + " млн, в расходы учредителей не входит." : ""))}
    ${tez("03", "Доход учредителей — " + MLN(c.incAll) + " млн ₽",
      "Погосян — <b>" + MLN(c.incP) + " млн</b>, Маланичев — <b>" + MLN(c.incM) + " млн</b>. Разница — личная выручка и личные расходы, общая часть у обоих одинаковая." + (dInc.txt ? " Против прошлого месяца — " + dInc.txt.replace("▲ ", "").replace("▼ ", "") + "." : ""))}
    ${tez("04", "К выплате — " + MLN(c.payAll) + " млн ₽",
      "С учётом накопленных остатков: Погосян " + MLN(c.payP) + " млн, Маланичев " + MLN(c.payM) + " млн. Дивиденды за месяц — " + fmt0(c.divAll) + " ₽.")}
  </div></section>

  <section class="tight"><div class="w">
    <div class="kick">${K("Показатели")}</div><h2>Ключевые цифры</h2>
    <div class="sb">Шесть чисел, по которым видно месяц</div>
    <div class="kpi">
      <div class="kc"><div class="v">${MLN(c.revNet)} <small>млн ₽</small></div>
        <div class="l">Выручка за месяц</div><div class="d ${dRev.cls}">${dRev.txt || "после возвратов пациентам"}</div></div>
      <div class="kc"><div class="v">${MLN(c.base60)} <small>млн ₽</small></div>
        <div class="l">Оплаты поставщикам · сч. 60</div><div class="d ${dCost.cls}">${pct(c.revNet ? c.base60 / c.revNet : 0)} от выручки${dCost.txt ? " · " + dCost.txt : ""}</div></div>
      <div class="kc"><div class="v">${MLN(fot)} <small>млн ₽</small></div>
        <div class="l">ФОТ с налогами</div><div class="d">зарплата ${MLN(p.sal)} + налоги ${MLN(p.tax)}</div></div>
      <div class="kc"><div class="v">${MLN(c.byBlock.m)} <small>млн ₽</small></div>
        <div class="l">Медицинские расходы</div><div class="d">${pct(mSh)} счёта 60</div></div>
      <div class="kc"><div class="v">${MLN(c.byBlock.u)} <small>млн ₽</small></div>
        <div class="l">Управленческие расходы</div><div class="d">${pct(uSh)} счёта 60</div></div>
      ${bank51 != null
        ? `<div class="kc"><div class="v">${MLN(bank51)} <small>млн ₽</small></div>
             <div class="l">Остаток на р/с на конец месяца</div><div class="d">на начало было ${MLN(st.acc["51"].total.openDt - st.acc["51"].total.openKt)}</div></div>`
        : `<div class="kc"><div class="v">${MLN(p.dep)} <small>млн ₽</small></div>
             <div class="l">Проценты по депозитам</div><div class="d">начислены банком на остатки</div></div>`}
    </div>
  </div></section>

  <section class="tight"><div class="w">
    <div class="kick">${K("Выручка")}</div><h2>Откуда пришли деньги</h2>
    <div class="sb">${fmt0(c.revNet)} ₽ — по группам врачей</div>
    <div class="dsplit">
      <div class="chartbox">${donut(revParts, MLN(c.revNet), "млн ₽ выручка")}</div>
      <div class="tw"><table>
        <tr><th>Группа</th><th class="num">Сумма, ₽</th><th class="num">Доля</th></tr>
        ${revParts.map(x => `<tr><td><span class="sw" style="background:${x.c}"></span>${esc(x.n)}</td>
          <td class="num">${fmt0(x.v)}</td><td class="num">${pct(x.v / den)}</td></tr>`).join("")}
        <tr class="tot"><td>Итого выручка</td><td class="num">${fmt0(c.revNet)}</td><td class="num">100,0 %</td></tr>
      </table></div>
    </div>
    ${chan}
  </div></section>

  ${daily}

  <section class="tight"><div class="w">
    <div class="kick">${K("Расходы")}</div><h2>Куда ушли деньги</h2>
    <div class="sb">${fmt0(c.base)} ₽ оплат поставщикам — медицинские против управленческих</div>
    <div class="stackbar">
      <div style="background:#2E5E4E;width:${(mSh*100).toFixed(2)}%">Медицинские · ${pct(mSh)}</div>
      <div style="background:#8A7350;width:${(uSh*100).toFixed(2)}%">Управленческие · ${pct(uSh)}</div>
    </div>
    <div class="rank">
      ${top.map(a => rankRow(a[0], a[1].sum, c.base, a[1].block === "управленческие")).join("")}
      ${rest > 0 ? rankRow("Остальные статьи — " + (arts.length - 9) + " шт.", rest, c.base) : ""}
    </div>
    ${c.credit > 0 ? `<div class="dnote"><b>За счёт кредитной линии:</b> ${fmt0(c.credit)} ₽ —
      ${esc(book.credit.join(", "))}. Стройка идёт на заёмные деньги, в расходы учредителей не входит.</div>` : ""}
  </div></section>

  <section class="tight"><div class="w">
    <div class="kick">${K("Экономика")}</div><h2>Как выручка стала доходом</h2>
    <div class="sb">млн ₽ · от поступлений к доходу учредителей</div>
    <div class="chartbox">${waterfall(wf)}</div>
  </div></section>

  <section class="dk"><div class="w">
    <div class="kick">${K("Учредители")}</div><h2>Доли учредителей</h2>
    <div class="sb">Общие расходы пополам, личные — каждому свои</div>
    <div class="own">
      ${who("Маланичев", G.mal, c.costM, c.incM, c.payM, p.prevM, p.divM)}
      ${who("Погосян", G.pog, c.costP, c.incP, c.payP, p.prevP, p.divP)}
    </div>
    <p class="onote">Выручка учитывается по зачислению на счёт, разрез по хирургам — по фактической оплате.
    Половина выручки других хирургов, косметологии, прочего и процентов по депозитам делится поровну.
    Расходы — оплаченные за месяц.${st.isExample ? " Показан август 2026 как пример." : ""}</p>
  </div></section>

  ${dyn}

  <footer><div class="w"><span>ООО «ОМЕГА» · клиника Форма</span><span>${per} · ${hist[st.month] && hist[st.month].closed ? "закрыт " + hist[st.month].closed.split("-").reverse().join(".") : "черновик"}</span></div></footer>`;
  let sn = 0;
  $("dashBody").innerHTML = out.replace(/\u00a7\u00a7/g, () => String(++sn).padStart(2, "0"));
}
document.getElementById("openDash").addEventListener("click", () => {
  renderDash();
  const d = document.getElementById("dash");
  d.hidden = false; d.scrollTop = 0;
  document.body.style.overflow = "hidden";
  document.getElementById("closeDash").focus();
});
function closeDash(){
  document.getElementById("dash").hidden = true;
  document.body.style.overflow = "";
  document.getElementById("openDash").focus();
}
document.getElementById("closeDash").addEventListener("click", closeDash);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("dash").hidden) closeDash();
});
</script>
