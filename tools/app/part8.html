<style>
/* ======================= взгляд финансового директора ======================= */
.fd{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:860px){.fd{grid-template-columns:1fr 1fr;gap:20px}}
.fdc{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;
  display:flex;flex-direction:column;gap:10px}
.fdc .tag2{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:600;padding:4px 9px;border-radius:99px;align-self:flex-start}
.fdc.obs .tag2{background:var(--tint);color:var(--mute)}
.fdc.lev .tag2{background:var(--green-soft);color:var(--green)}
.fdc.risk .tag2{background:var(--bronze-soft);color:var(--bronze)}
.fdc h4{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.2}
.fdc .big{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.fdc p{font-size:14px;line-height:1.55;color:var(--ink2)}
.fdc .lever{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.fdc .lever b{font-family:var(--mono);font-weight:600;color:var(--green);white-space:nowrap}
.fdnote{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--mute);
  margin-top:22px;line-height:1.5;max-width:74ch}
</style>
<script>
"use strict";
/* Наблюдения считаются из загруженных данных. Никаких отраслевых нормативов —
   только цифры клиники, их доли и чувствительность в рублях. */
function cfoCards(c){
  const p = st.params, tk = st.taksk, out = [];
  const per = typeof periodTrouble === "function" ? periodTrouble() : {bad:[], wide:[]};
  if (per.bad.length) return [{kind:"risk", tag:"Стоп", h:"Выгрузки за разные месяцы",
    big:"—", text:"Часть файлов относится не к " + monthName(st.month) + ": " + per.bad.join(", ") +
    ". Пока это так, доли и маржа считаются по смеси периодов и смысла не имеют.",
    lever:"Загрузите выгрузки за один месяц — раздел пересчитается сам.", w:1e12}];
  const rev = c.revNet, pp = x => pct(rev ? x / rev : 0);
  /* w — во сколько рублей в месяц упирается вывод. По нему потом отбор:
     мелочь ниже порога значимости не показывается вовсе. */
  const card = (kind, tag, h, big, text, lever, w) =>
    out.push({kind, tag, h, big, text, lever, w: w || 0});

  /* 1. маржа и её цена */
  if (rev > 0){
    card("obs", "Маржа", "Из выручки остаётся " + pct(c.incAll / rev),
      fmt0(c.incAll) + " ₽",
      "На каждые 100 ₽, пришедших от пациентов, у вас двоих остаётся " +
      (c.incAll / rev * 100).toFixed(1).replace(".", ",") + " ₽. Остальное — гонорары, материалы, зарплата, аренда и налоги.",
      "Один процент маржи стоит <b>" + fmt0(rev / 100) + " ₽</b> в месяц, или " + fmt0(rev / 100 * 12) + " ₽ в год.", rev / 50);
  }
  /* 2. разовые статьи — какой была бы маржа без них */
  const an = anomalies(c);
  if (an && an.fresh.length){
    const big1 = an.fresh.filter(x => x[1] > rev * 0.01).sort((a, b) => b[1] - a[1]);
    if (big1.length){
      const s = big1.reduce((a, x) => a + x[1], 0);
      card("obs", "Разовое", "Разовых расходов на " + fmt0(s),
        pct((c.incAll + s) / rev),
        "В прошлом месяце этих статей не было: " + big1.map(x => x[0] + " " + fmt0(x[1])).join(", ") +
        ". Если месяц повторится без них, доход был бы " + fmt0(c.incAll + s) + " ₽.",
        "Столько же — <b>" + fmt0(s) + " ₽</b> — стоит " + (s / (rev / 100)).toFixed(1).replace(".", ",") + " процентных пункта маржи.", s);
    }
  }
  /* 3. гонорары как главный рычаг */
  const gon = c.byArt["Гонорары ИП хирургов"];
  if (gon && rev > 0){
    card("lev", "Рычаг", "Гонорары хирургов — " + pp(gon.sum) + " выручки",
      fmt0(gon.sum) + " ₽",
      "Это " + pct(c.base ? gon.sum / c.base : 0) + " всех оплат поставщикам и самая крупная статья расходов. " +
      "Сумма уже за вычетом материалов, потраченных на операции этих хирургов, — полная ставка выше. " +
      "Ставка гонорара — единственный параметр, который двигает доходность сильнее любого другого.",
      "Сдвиг средней ставки на 1 % — <b>" + fmt0(gon.sum / 100) + " ₽</b> в месяц.", gon.sum / 100);
    const vs = st.vendors.filter(v => (book.vendors[v.name] || [])[0] === "Гонорары ИП хирургов")
      .sort((a, b) => b.paid - a.paid);
    if (vs.length && vs[0].paid / gon.sum > 0.2){
      card("risk", "Концентрация", "На одного хирурга — " + pct(vs[0].paid / gon.sum) + " гонораров",
        fmt0(vs[0].paid) + " ₽",
        vs[0].name + " получает больше пятой части всего гонорарного фонда. Если он уйдёт, вместе с ним уйдёт и его поток пациентов. " +
        "Всего хирургов с гонорарами — " + vs.length + ".",
        "Его гонорар — <b>" + pp(vs[0].paid) + "</b> выручки клиники.", vs[0].paid);
    }
  }
  /* 4. собственные операции против чужих */
  const own = R2(c.G.mal + c.G.pog);
  if (rev > 0 && own > 0){
    card("obs", "Структура", "Свои операции — " + pp(own) + " выручки",
      fmt0(own) + " ₽",
      "Остальные " + pp(R2(rev - own)) + " делает клиника без вас: другие хирурги, косметология, прочее. " +
      "Ваш доход зависит от клиники как бизнеса сильнее, чем от собственного операционного дня.",
      "Половина чужой выручки, которая приходит каждому, — <b>" + fmt0(R2((c.otherNet + c.G.cosm + c.G.misc) / 2)) + " ₽</b>.", 0);
  }
  /* 5. деньги пациентов вперёд против заёмных */
  if (tk && tk.adv > 0){
    const txt = "Пациенты внесли вперёд " + fmt0(tk.adv) + " ₽ — это " + pct(tk.sum ? tk.adv / tk.sum : 0) +
      " всего пробитого за месяц. Такие деньги работают в обороте бесплатно." +
      (p.int > 0 ? " При этом за кредит вы заплатили " + fmt0(p.int) + " ₽ процентов." : "");
    card("lev", "Финансирование", "Авансы пациентов — " + fmt0(tk.adv),
      fmt0(tk.adv) + " ₽", txt,
      p.int > 0 ? "Проценты по кредиту за год — <b>" + fmt0(p.int * 12) + " ₽</b>. Рост предоплат закрывает эту потребность без банка."
        : "Это бесплатный источник оборотных средств.", tk.adv / 10);
  }
  /* 6. депозиты против кредита — чистая позиция */
  if (p.dep > 0 || p.int > 0){
    const net = R2(p.dep - p.int);
    card(net >= 0 ? "obs" : "risk", "Деньги", net >= 0 ? "Проценты работают в плюс" : "Кредит дороже депозитов",
      (net >= 0 ? "+" : "") + fmt0(net) + " ₽",
      "Депозиты принесли " + fmt0(p.dep) + " ₽, кредит стоил " + fmt0(p.int) + " ₽. " +
      (net >= 0 ? "Пока держать деньги на депозите выгоднее, чем гасить кредит досрочно."
                : "Каждый рубль, снятый с депозита на погашение кредита, экономит больше, чем приносит."),
      "За год это <b>" + (net >= 0 ? "+" : "") + fmt0(net * 12) + " ₽</b>.", Math.abs(net) * 12);
  }
  /* 7. эквайринг */
  const a57 = st.acc["57"];
  const fee = a57 ? R2(N(a57.total.ktBy["91"])) : 0;
  const turn = a57 ? R2(N(a57.total.dtBy["62"])) : 0;
  if (fee > 0 && turn > 0){
    card("lev", "Рычаг", "Эквайринг стоит " + pct(fee / turn) + " оборота",
      fmt0(fee) + " ₽",
      "С " + fmt0(turn) + " ₽, принятых картами, банк удержал " + fmt0(fee) + " ₽. " +
      "Ставка эквайринга обсуждаема, особенно при таком обороте.",
      "Каждая десятая процента ставки — <b>" + fmt0(turn / 1000) + " ₽</b> в месяц.", fee);
  }
  /* 8. неровная загрузка */
  if (tk && tk.days > 20){
    const dd = Object.keys(tk.byDay).sort(), vals = dd.map(k => tk.byDay[k]);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const low = vals.slice().sort((a, b) => a - b).slice(0, 10);
    const gap = R2(low.reduce((a, v) => a + Math.max(0, avg - v), 0));
    const best = Math.max(...vals), worst = Math.min(...vals);
    card("lev", "Загрузка", "Сильный день к тихому — " + (worst ? (best / worst).toFixed(1).replace(".", ",") : "—") + "×",
      fmt0(gap) + " ₽",
      "Средний день — " + fmt0(avg) + " ₽, самый тихий — " + fmt0(worst) + " ₽. Десять самых слабых дней недобрали " +
      fmt0(gap) + " ₽ до среднего. Это не спрос, это расписание: операционные и кабинеты в эти дни простаивали.",
      "Подтянуть тихие дни до среднего — <b>" + fmt0(gap) + " ₽</b> в месяц без единого нового пациента.", gap);
  }
  /* 9. управленческие */
  if (c.byBlock.u > 0 && rev > 0){
    card("obs", "Расходы", "Управленческие — " + pp(c.byBlock.u) + " выручки",
      fmt0(c.byBlock.u) + " ₽",
      "Всё, что не лечит: аренда, маркетинг, IT, юристы, хозрасходы. Медицинские при этом — " + pp(c.byBlock.m) + " выручки.",
      "Сокращение управленческих на десятую часть — <b>" + fmt0(c.byBlock.u / 10) + " ₽</b> в месяц.", c.byBlock.u / 10);
  }
  /* 10. средний чек */
  if (tk && tk.checks > 0){
    card("obs", "Чек", "Средний чек — " + fmt0(tk.live / tk.checks),
      fmt0(R2(tk.live / tk.checks)) + " ₽",
      "За месяц " + tk.checks + " чеков на " + fmt0(tk.live) + " ₽ живых денег. " +
      "Средний чек двигается двумя способами: цена и то, сколько услуг попадает в один визит.",
      "Плюс 1 % к среднему чеку — <b>" + fmt0(tk.live / 100) + " ₽</b> в месяц.", tk.live / 100);
  }
  /* --- правила, которые срабатывают только в своей ситуации --- */
  const prev = hist[shiftMonth(st.month, -1)];
  const a51 = st.acc["51"];
  const bank51 = a51 ? R2(a51.total.openDt - a51.total.openKt + a51.total.dt - a51.total.kt) : null;

  /* ФОТ к выручке */
  if (rev > 0 && (p.sal + p.tax) > 0){
    const fot = R2(p.sal + p.tax);
    card("obs", "ФОТ", "Зарплата с налогами — " + pp(fot) + " выручки", fmt0(fot) + " ₽",
      "Зарплата по банку " + fmt0(p.sal) + " ₽ плюс налоги с неё " + fmt0(p.tax) + " ₽. " +
      "Это расходы, которые не зависят от того, сколько операций прошло за месяц.",
      "Один процент ФОТ — <b>" + fmt0(fot / 100) + " ₽</b> в месяц.", fot / 100);
  }
  /* расходы против выручки, месяц к месяцу */
  if (prev && prev.rev && prev.cost && rev > 0){
    const dR = rev / prev.rev - 1, dC = c.costAll / prev.cost - 1;
    const mNow = c.incAll / rev, mWas = (prev.inc != null ? prev.inc / prev.rev : null);
    if (Math.abs(dR - dC) > 0.02){
      card(dC > dR ? "risk" : "lev", "Динамика",
        dC > dR ? "Расходы растут быстрее выручки" : "Расходы отстают от выручки",
        (dR >= 0 ? "+" : "") + pct(dR) + " / " + (dC >= 0 ? "+" : "") + pct(dC),
        "Против " + monthName(shiftMonth(st.month, -1)) + " выручка " + (dR >= 0 ? "выросла" : "упала") +
        " на " + pct(Math.abs(dR)) + ", расходы " + (dC >= 0 ? "выросли" : "упали") + " на " + pct(Math.abs(dC)) + "." +
        (mWas != null ? " Маржа была " + pct(mWas) + ", стала " + pct(mNow) + "." : ""),
        mWas != null ? "Разница маржи стоит <b>" + fmt0(Math.abs(mNow - mWas) * rev) + " ₽</b> в месяц."
          : "Разрыв темпов — <b>" + pct(Math.abs(dR - dC)) + "</b>.",
        mWas != null ? Math.abs(mNow - mWas) * rev : Math.abs(dR - dC) * rev);
    }
  }
  /* месяц против среднего за полгода */
  const back = [];
  for (let i = 1; i <= 6; i++){ const h = hist[shiftMonth(st.month, -i)]; if (h && h.rev) back.push(h.rev); }
  if (back.length >= 3 && rev > 0){
    const avg = back.reduce((a, b) => a + b, 0) / back.length;
    const d = rev / avg - 1;
    if (Math.abs(d) > 0.05){
      card(d >= 0 ? "obs" : "risk", "Месяц", (d >= 0 ? "Выше" : "Ниже") + " среднего на " + pct(Math.abs(d)),
        fmt0(rev) + " ₽",
        "Средняя выручка за последние " + back.length + " месяцев — " + fmt0(avg) + " ₽. " +
        "Этот месяц " + (d >= 0 ? "лучше" : "слабее") + " на " + fmt0(Math.abs(R2(rev - avg))) + " ₽.",
        "Вернуться к среднему — <b>" + fmt0(Math.abs(R2(rev - avg))) + " ₽</b> выручки.", Math.abs(R2(rev - avg)));
    }
  }
  /* доля наличных */
  if (tk && tk.live > 0 && tk.cash / tk.live > 0.2){
    card("obs", "Наличные", "Наличными приходит " + pct(tk.cash / tk.live), fmt0(tk.cash) + " ₽",
      "Пятая часть и больше приходит купюрами. Это инкассация, хранение, пересчёт и лишние руки в кассе. " +
      "Безналом за месяц — " + fmt0(tk.card) + " ₽.",
      "Перевод десятой части наличных в карты — <b>" + fmt0(tk.cash / 10) + " ₽</b> меньше кассовых операций в месяц.", tk.cash / 20);
  }
  /* авансы против прошлого месяца */
  if (tk && prev && prev.tk && prev.tk.adv){
    const d = tk.adv / prev.tk.adv - 1;
    if (Math.abs(d) > 0.15)
      card(d >= 0 ? "lev" : "risk", "Предоплаты", (d >= 0 ? "Авансов больше на " : "Авансов меньше на ") + pct(Math.abs(d)),
        fmt0(tk.adv) + " ₽",
        "В " + monthName(shiftMonth(st.month, -1)) + " зачли " + fmt0(prev.tk.adv) + " ₽, сейчас " + fmt0(tk.adv) + " ₽. " +
        "Зачёт аванса — это операции, оплаченные раньше: он показывает, сколько записей было набрано в прошлые месяцы.",
        d >= 0 ? "Запас оплаченных вперёд операций растёт."
               : "Падение предоплат обычно приходит в выручку через месяц-другой.",
        Math.abs(R2(tk.adv - prev.tk.adv)));
  }
  /* возвраты */
  if (p.refund > 0 && rev > 0 && p.refund / rev > 0.003){
    card("obs", "Возвраты", "Возвраты пациентам — " + pp(p.refund), fmt0(p.refund) + " ₽",
      "За месяц вернули " + fmt0(p.refund) + " ₽. Каждый возврат это несостоявшаяся операция и, как правило, разговор, " +
      "который стоил времени.", "Годовой масштаб — <b>" + fmt0(p.refund * 12) + " ₽</b>.", p.refund);
  }
  /* личные расходы разошлись */
  const lo = Math.min(c.persM, c.persP), hi = Math.max(c.persM, c.persP);
  if (lo > 0 && hi / lo > 2.5){
    const who = c.persP > c.persM ? "Погосяна" : "Маланичева";
    /* личные расходы идут за операциями, поэтому «выровнять» их нельзя —
       считаем на процедуру, а не к выручке */
    const cnt = (st.doctors && st.doctors.cnt) || {}, cs = (st.doctors && st.doctors.cntSurg) || {};
    const nOf = w => cs[w] || cnt[w] || 0;
    const nM = nOf(book.founders.mal), nP = nOf(book.founders.pog);
    const prc = n => n + " " + (n % 10 === 1 && n % 100 !== 11 ? "процедура"
      : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "процедуры" : "процедур"));
    const foot = (nM && nP)
      ? "На одну процедуру: Маланичев <b>" + fmt0(c.persM / nM) + " ₽</b> (" + prc(nM) + "), " +
        "Погосян <b>" + fmt0(c.persP / nP) + " ₽</b> (" + prc(nP) + "). Сравнивать корректно только так."
      : "Сравнивать эти суммы имеет смысл только в расчёте на одну операцию, а не к выручке.";
    card("obs", "Личные", "Личные расходы учредителей различаются в " + (hi / lo).toFixed(1).replace(".", ",") + " раза",
      fmt0(R2(hi - lo)) + " ₽",
      "У " + who + " личных расходов на " + fmt0(R2(hi - lo)) + " ₽ больше — и именно эта разница делает доходы разными: " +
      "общая часть у обоих одинаковая до копейки. Личные расходы (материалы за операции, анализы, свой ассистент) " +
      "идут за операциями: чем их больше и чем они сложнее, тем выше сумма, а ставки ассистентов у каждого свои.",
      foot, R2(hi - lo) / 2);
  }
  /* запас прочности */
  if (bank51 != null && c.costAll > 0){
    const m = bank51 / c.costAll;
    card(m < 0.5 ? "risk" : "obs", "Запас", "Остатка хватит на " + m.toFixed(1).replace(".", ",") + " месяца расходов",
      fmt0(bank51) + " ₽",
      "На расчётном счёте на конец месяца " + fmt0(bank51) + " ₽ при расходах " + fmt0(c.costAll) + " ₽ в месяц. " +
      "Депозиты сюда не входят.",
      m < 0.5 ? "Меньше половины месяца — любая задержка поступлений упрётся в кассовый разрыв."
              : "Один месяц расходов — <b>" + fmt0(c.costAll) + " ₽</b>.",
      m < 0.5 ? c.costAll : rev / 200);
  }
  /* кредитная линия */
  if (c.credit > 0){
    card("risk", "Кредит", "За месяц выбрано " + fmt0(c.credit), fmt0(c.credit) + " ₽",
      "Стройка идёт на заёмные: " + book.credit.join(", ") + ". В расходы учредителей это не попадает, " +
      "но долг растёт, а проценты уже платятся — " + fmt0(p.int) + " ₽ за месяц.",
      "При таком темпе за год — <b>" + fmt0(c.credit * 12) + " ₽</b> долга и " + fmt0(p.int * 12) + " ₽ процентов.", c.credit);
  }
  /* 11. тренд по истории */
  const yr = +st.month.slice(0, 4), mo = +st.month.slice(5, 7);
  const near = [], far = [];
  for (let i = 1; i <= 3; i++){
    const a = hist[shiftMonth(st.month, -i)], b = hist[shiftMonth(st.month, -i - 3)];
    if (a && a.rev) near.push(a.rev);
    if (b && b.rev) far.push(b.rev);
  }
  if (near.length === 3 && far.length === 3){
    const n = near.reduce((a, b) => a + b, 0) / 3, f = far.reduce((a, b) => a + b, 0) / 3;
    const d = n / f - 1;
    card(d >= 0 ? "obs" : "risk", "Тренд", (d >= 0 ? "Рост " : "Спад ") + pct(Math.abs(d)) + " за полгода",
      fmt0(n) + " ₽",
      "Последние три месяца в среднем " + fmt0(n) + " ₽ против " + fmt0(f) + " ₽ в предыдущие три. " +
      "Отчётный месяц — " + fmt0(rev) + " ₽.",
      "Разница трёхмесячных средних — <b>" + (d >= 0 ? "+" : "") + fmt0(R2(n - f)) + " ₽</b> в месяц.", Math.abs(R2(n - f)));
  }
  /* сверки вперёд всего: по несошедшимся цифрам выводы делать нельзя */
  const red = checks(c).filter(x => x.ok === false);
  if (red.length) out.unshift({kind:"risk", tag:"Сверки", h:"Не сошлось: " + red.length,
    big:"—", text:red.map(x => x.what).join("; ") + ". Пока это не закрыто, доли и маржа ниже могут быть неполными.",
    lever:"Откройте этап «Сверки и отчёт» — там написано, чего не хватает."});
  /* Порог значимости: вывод остаётся, если действие по нему двигает
     хотя бы 0,2 % месячной выручки. Вывод ради количества хуже, чем его
     отсутствие, поэтому мелочь не показывается вовсе. */
  const floor = rev * 0.002;
  const rank = {risk:0, lev:1, obs:2};
  return out
    .filter(x => x.kind === "risk" || x.w >= floor)
    .sort((a, b) => (rank[a.kind] - rank[b.kind]) || (b.w - a.w))
    .slice(0, 8);
}
function cfoSection(c){
  const cards = cfoCards(c);
  if (!cards.length) return "";
  return `<section class="tight"><div class="w">
    <div class="kick">§§ · Выводы</div><h2>Что показывают цифры</h2>
    <div class="sb">Посчитано из цифр месяца · отобрано по величине, каждый вывод заканчивается суммой</div>
    <div class="fd">${cards.map(x => `<div class="fdc ${x.kind}">
      <span class="tag2">${esc(x.tag)}</span>
      <h4>${esc(x.h)}</h4>
      <div class="big">${x.big}</div>
      <p>${esc(x.text)}</p>
      <div class="lever">${x.lever}</div>
    </div>`).join("")}</div>
    <p class="fdnote">Здесь нет отраслевых нормативов и чужих бенчмарков — только ваши цифры,
    их доли и чувствительность. Выводы, которые ниже порога значимости, не показываются вовсе.</p>
  </div></section>`;
}
</script>
